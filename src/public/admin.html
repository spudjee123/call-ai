async function saveContactEdit(){
  const originalPhone = document.getElementById('ce_original_phone').value
  const phone = document.getElementById('ce_phone').value.trim()
  const name = document.getElementById('ce_name').value.trim()
  const campaign = document.getElementById('ce_campaign').value
  const msgEl = document.getElementById('contactEditMsg')
  if (!phone || !campaign) { msgEl.textContent = 'กรอกเบอร์และเลือก campaign ก่อน'; return }
  try {

/* ==================== bulk import ==================== */
let lastParsedRows = []
function parsePastedContacts(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.includes('\t') ? line.split('\t') : line.split(',')
    const phone = (parts[0] || '').trim()
    const name = (parts[1] || '').trim()
    const digits = phone.replace(/[^\d+]/g, '')
    return { phone, name, valid: digits.length >= 9 }
  })
}
// อ่านไฟล์ .csv/.txt ที่อัปโหลดแล้วใส่ลงช่องวางข้อความเดิม — ใช้ parser ตัวเดียวกับการ paste เป๊ะ (parsePastedContacts รองรับ comma อยู่แล้ว)
// ให้ผู้ใช้เห็นและตรวจสอบตัวอย่างในกล่อง preview ก่อนกดนำเข้าจริงเสมอ ไม่นำเข้าจากไฟล์ตรงๆ โดยไม่ให้ตรวจก่อน
function handleBulkFileUpload(file){
  if (!file) return
  document.getElementById('bulkFileName').textContent = file.name
  const reader = new FileReader()
  reader.onload = (e) => {
    const text = String(e.target.result || '')
    document.getElementById('bulkPaste').value = text
    handleBulkPaste(text)
    toast('โหลดไฟล์แล้ว — ตรวจสอบตัวอย่างข้อมูลก่อนกดนำเข้า')
  }
  reader.onerror = () => toast('อ่านไฟล์ไม่สำเร็จ', 'danger')
  reader.readAsText(file, 'UTF-8')
}
function handleBulkPaste(text){
  lastParsedRows = parsePastedContacts(text)
  const summaryEl = document.getElementById('importSummary')
  const previewEl = document.getElementById('importPreview')
  const btn = document.getElementById('bulkImportBtn')
  const countEl = document.getElementById('bulkImportCount')
  const validCount = lastParsedRows.filter(r => r.valid).length
  const invalidCount = lastParsedRows.length - validCount

  if (!lastParsedRows.length) {
    summaryEl.style.display = 'none'; previewEl.style.display = 'none'
    btn.disabled = true; countEl.textContent = '0'
    return
  }
  summaryEl.style.display = 'flex'
  summaryEl.innerHTML = `พบ <b>${lastParsedRows.length}</b> แถว &middot; ถูกต้อง <b class="ok">${validCount}</b>${invalidCount ? ` &middot; ข้าม <b class="bad">${invalidCount}</b> (เบอร์ไม่ถูกต้อง)` : ''}`
  previewEl.style.display = 'block'
  previewEl.innerHTML = `<table><tbody>${lastParsedRows.map(r => `
    <tr class="${r.valid?'':'row-invalid'}">
      <td class="num" style="width:36%">${esc(r.phone)}</td>
      <td>${esc(r.name) || '<span style=\"color:var(--text-3)\">— ไม่มีชื่อ —</span>'}</td>
      <td style="width:60px; text-align:right">${r.valid ? icon('check') : icon('warn')}</td>
    </tr>`).join('')}</tbody></table>`
  countEl.textContent = validCount
  btn.disabled = validCount === 0
}
async function runBulkImport(){
  const campaign = document.getElementById('bulkCampaign').value
  if (!campaign) { toast('เลือก Campaign ก่อนนำเข้า', 'danger'); return }
  const valid = lastParsedRows.filter(r => r.valid).map(r => ({ phone: r.phone, name: r.name }))
  try {
    const res = await apiFetch('/api/contacts/bulk', { method: 'POST', body: { contacts: valid, campaign } })
    const data = await res.json()
    if (!res.ok) { toast(data.error || 'นำเข้าไม่สำเร็จ', 'danger'); return }
    toast(`นำเข้า ${data.count} เบอร์เรียบร้อย`)
    document.getElementById('bulkPaste').value = ''
    handleBulkPaste('')
    loadContacts()
  } catch (e) {}
}

// เติมช่องวันที่ให้เป็นช่วงที่ครอบคลุมข้อมูลที่โหลดมาจริง (ไม่ใช่ mm/dd/yyyy ว่างๆ) โดยไม่กรองอะไรออกไปเพิ่ม
// ไม่ทับถ้าผู้ใช้ตั้งช่วงวันที่เองไว้แล้ว (เช่นกด "รีเฟรช" ซ้ำหลังปรับวันที่เอง)
function initHistoryDateRangeDefaults(){
  const monthSel = document.getElementById('historyMonthPicker')

  const fromEl = document.getElementById('historyDateFrom')
  const toEl = document.getElementById('historyDateTo')

  if (!days.length) return
  fromEl.value = days.reduce((a, b) => a < b ? a : b)
  toEl.value = days.reduce((a, b) => a > b ? a : b)
}
// dropdown "เวลา" ของหน้าประวัติการโทร — กรองจากข้อมูลที่โหลดมาแล้วในเครื่อง ไม่ต้องยิง server ใหม่

function historyFilterChanged(){ historyPage = 1; renderHistoryRows() }
function loadMoreHistory(){ historyPage++; renderHistoryRows() }
// ค่าเริ่มต้นเรียงตามวันที่ล่าสุดก่อน (ตรงกับลำดับเดิมที่ backend ส่งมาให้อยู่แล้ว — ไม่ใช่การเปลี่ยนพฤติกรรม default)
let historySortState = { key: 'timestamp', dir: -1 }
function sortHistory(key){
  if (historySortState.key === key) historySortState.dir *= -1
  else { historySortState.key = key; historySortState.dir = 1 }
  historyPage = 1
  renderHistoryRows()
}
// ใช้ร่วมกันทั้งตารางและ CSV export เพื่อให้ export ตรงกับสิ่งที่กรอง+เรียงอยู่บนหน้าจอจริง
function getFilteredHistory(){
  const q = (document.getElementById('historySearchInput')?.value || '').trim().toLowerCase()
  const outcomeFilter = document.getElementById('historyOutcomeFilter')?.value || ''
  const numberFilter = document.getElementById('logNumberFilter')?.value || ''
  const dateFrom = document.getElementById('historyDateFrom')?.value || ''
  const dateTo = document.getElementById('historyDateTo')?.value || ''
  const filtered = historyCache.map((c,i) => ({...c, i})).filter(c => {
    if (q && !((c.phone||'').includes(q) || (c.name||'').toLowerCase().includes(q))) return false
    if (outcomeFilter && c.outcome !== outcomeFilter) return false
    if (numberFilter && c.twilio_number !== numberFilter) return false
    const day = (c.timestamp || '').slice(0, 10)
    if (dateFrom && day < dateFrom) return false
    if (dateTo && day > dateTo) return false
    return true
  })
  return sortRows(filtered, historySortState)
}
function renderHistoryRows(){
  updateSortIndicators('historyThead', historySortState)
  const all = getFilteredHistory()
  const shown = all.slice(0, historyPage * HISTORY_PAGE_SIZE)
  const body = document.getElementById('historyBody')
  if (!body) return
  if (!shown.length) { body.innerHTML = '<tr><td colspan="9" class="empty">ไม่พบข้อมูล</td></tr>'; document.getElementById('historyLoadMoreWrap').innerHTML = ''; return }
  body.innerHTML = shown.map(c => {
    const needsFollowup = (c.next_action || '').trim() && c.next_action.trim() !== '-'
    return `
    <tr class="clickable" onclick="openHistoryModal(${c.i})">
      <td class="num">${esc(c.phone)}</td>
      <td>${esc(c.name)}</td>
      <td style="color:var(--text-2)">${esc(campaignName(c.campaign_id))}</td>
      <td class="num" style="color:var(--text-2); font-size:12.5px">${esc(twilioNumberLabel(c.twilio_number))}</td>
      <td><span class="pill ${esc(c.call_status)}">${esc(CALL_STATUS_LABELS[c.call_status] || c.call_status || '-')}</span></td>
      <td>
        ${c.outcome && c.outcome !== '-' ? `<span class="pill ${esc(c.outcome)}">${esc(outcomeLabel(c.outcome))}</span>` : '<span style="color:var(--text-3)">—</span>'}
        ${needsFollowup ? `<span title="${escAttr('ต้องติดตามต่อ: ' + c.next_action)}" style="margin-left:5px">📌</span>` : ''}
        ${c.sms_status ? `<span title="${escAttr('SMS: ' + (SMS_STATUS_LABELS[c.sms_status] || c.sms_status))}" style="margin-left:5px">${c.sms_status === 'failed' ? '📵' : '📩'}</span>` : ''}
      </td>
      <td style="color:var(--text-2)">${esc((c.summary||'').substring(0,40))}</td>
      <td class="num">${fmtDur(c.duration)}</td>
      <td class="num" style="color:var(--text-2); font-size:12.5px">${esc(fmtDate(c.timestamp))}</td>
    </tr>`
  }).join('')
  const wrap = document.getElementById('historyLoadMoreWrap')
  wrap.innerHTML = shown.length < all.length
    ? `<button class="btn btn-sm" onclick="loadMoreHistory()">โหลดเพิ่ม (เหลืออีก ${all.length - shown.length} รายการ)</button>`
    : `<span style="font-size:12px; color:var(--text-3)">แสดงครบทั้งหมดแล้ว (${all.length} รายการ)</span>`
}
function exportHistoryCsv(){
  const rows = getFilteredHistory()
  if (!rows.length) { toast('ไม่มีข้อมูลให้ออกรายงาน', 'danger'); return }
  const cols = ['phone','name','campaign_id','twilio_number','call_status','outcome','summary','key_points','next_action','duration','timestamp']
  // เติม ' นำหน้าถ้าค่าขึ้นต้นด้วยอักขระที่ Excel/Sheets ตีความเป็นสูตร (มาตรฐาน OWASP CSV injection) — ใช้กับทุกคอลัมน์รวมถึง phone ด้วย
  // เคยลองยกเว้นคอลัมน์ phone (เพราะขึ้นต้นด้วย + เสมอจาก normalizePhone ไม่ใช่ข้อความอิสระ) แต่ทดสอบเปิดจริงด้วย Excel (COM automation) แล้วพบว่า
  // ถ้าไม่มี ' นำหน้า Excel จะตีความ "+66812345678" เป็นตัวเลขแล้วโชว์เป็น "6.68E+10" (เลขหาย/อ่านไม่ออกเลย) แย่กว่าการมี ' ค้างให้เห็นมาก
  // ' นำหน้าเลยจำเป็นสำหรับ phone ด้วยเหตุผลด้าน Excel ล้วนๆ ไม่ใช่แค่ความปลอดภัย — และยังกันเบอร์ที่หลุด normalizePhone มา
  // (เช่น "=1234567890" ผ่าน validation ได้จริงเพราะเช็คแค่จำนวนหลัก ไม่เช็คอักขระนำหน้า) ไม่ให้กลายเป็นสูตรตอนเปิดไฟล์ด้วย
  const escCsv = v => {
    let s = String(v==null?'':v)
    if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`
    return `"${s.replace(/"/g,'""')}"`
  }
  const lines = [cols.join(',')].concat(rows.map(c => cols.map(k => escCsv(c[k])).join(',')))
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `call-history-${new Date().toISOString().slice(0,10)}.csv`
  a.click()
  URL.revokeObjectURL(url)
  toast('ออกรายงาน CSV แล้ว')
}

  resultEl.innerHTML = `
    ${contactCard}
    ${blockBadge}
    <h3 style="font-size:14.5px; margin-bottom:10px">ประวัติการโทร (${calls ? calls.length : 0} ครั้ง)</h3>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Campaign</th><th>การเชื่อมต่อ</th><th>ผล</th><th>เวลาคุย</th><th>วันที่</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>
    </div>
    ${!blocked ? `<div class="row" style="margin-top:14px"><button class="btn btn-sm btn-ghost danger" onclick="confirmBlockContact('${escJsAttr(phone)}')">${icon('block')} เพิ่มเข้า Do-not-call list</button></div>` : ''}`
}

/* ==================== boot ==================== */
window.onload = async () => {
  if (!token) { showLogin(); return }
  try {
    await apiFetch('/api/health/status')
    showApp()
  } catch (e) { showLogin() }
}
</script>
</body>
</html>
