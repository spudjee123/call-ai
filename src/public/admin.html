<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call AI — Control Center</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f1f7;
    --mesh-1: #8b7bff; --mesh-2: #5ec8ff; --mesh-3: #ff9ecf;
    --dot: rgba(20,20,40,.06);
    --glass-bg: rgba(255,255,255,.58);
    --glass-bg-strong: rgba(255,255,255,.78);
    --glass-border: rgba(255,255,255,.65);
    --surface-2: rgba(255,255,255,.62);
    --surface-solid: #ffffff;
    --text: #1a1a1f;
    --text-2: #63636d;
    --text-3: #8b8b94;
    --accent: #6a5cff;
    --accent-2: #17c3e6;
    --accent-hover: #5a4ce6;
    --accent-soft: rgba(106,92,255,.12);
    --success: #1f9d55; --success-soft: rgba(31,157,85,.14);
    --danger: #e0263f; --danger-soft: rgba(224,38,63,.12);
    --warning: #d98216; --warning-soft: rgba(217,130,22,.14);
    --sidebar-bg: rgba(24,22,38,.72);
    --sidebar-text: rgba(255,255,255,.66);
    --sidebar-text-active: #ffffff;
    --sidebar-active-bg: rgba(255,255,255,.14);
    --shadow-card: 0 1px 1px rgba(20,10,60,.03), 0 12px 32px rgba(20,10,60,.10);
    --shadow-pop: 0 24px 70px rgba(10,5,40,.35);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #06060a;
      --mesh-1: #4d3fc7; --mesh-2: #1478a8; --mesh-3: #a83a72;
      --dot: rgba(255,255,255,.055);
      --glass-bg: rgba(30,28,42,.55);
      --glass-bg-strong: rgba(30,28,42,.78);
      --glass-border: rgba(255,255,255,.10);
      --surface-2: rgba(255,255,255,.07);
      --surface-solid: #17161f;
      --text: #f3f2fa;
      --text-2: #a4a3b3;
      --text-3: #78778a;
      --accent: #8b7bff;
      --accent-2: #34d3f0;
      --accent-hover: #a396ff;
      --accent-soft: rgba(139,123,255,.2);
      --success: #35d573; --success-soft: rgba(53,213,115,.16);
      --danger: #ff5468; --danger-soft: rgba(255,84,104,.18);
      --warning: #ffab3a; --warning-soft: rgba(255,171,58,.18);
      --sidebar-bg: rgba(10,9,16,.75);
      --sidebar-text: rgba(255,255,255,.6);
      --sidebar-active-bg: rgba(255,255,255,.12);
      --shadow-card: 0 1px 1px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
      --shadow-pop: 0 24px 70px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #06060a; --mesh-1: #4d3fc7; --mesh-2: #1478a8; --mesh-3: #a83a72; --dot: rgba(255,255,255,.055);
    --glass-bg: rgba(30,28,42,.55); --glass-bg-strong: rgba(30,28,42,.78); --glass-border: rgba(255,255,255,.10);
    --surface-2: rgba(255,255,255,.07); --surface-solid: #17161f; --text: #f3f2fa; --text-2: #a4a3b3; --text-3: #78778a;
    --accent: #8b7bff; --accent-2: #34d3f0; --accent-hover: #a396ff; --accent-soft: rgba(139,123,255,.2);
    --success: #35d573; --success-soft: rgba(53,213,115,.16); --danger: #ff5468; --danger-soft: rgba(255,84,104,.18);
    --warning: #ffab3a; --warning-soft: rgba(255,171,58,.18); --sidebar-bg: rgba(10,9,16,.75);
    --sidebar-text: rgba(255,255,255,.6); --sidebar-active-bg: rgba(255,255,255,.12);
    --shadow-card: 0 1px 1px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5); --shadow-pop: 0 24px 70px rgba(0,0,0,.65);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; position: relative;
  }
  .mesh {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--mesh-1) 38%, transparent), transparent 42%),
      radial-gradient(circle at 85% 12%, color-mix(in srgb, var(--mesh-2) 32%, transparent), transparent 45%),
      radial-gradient(circle at 70% 85%, color-mix(in srgb, var(--mesh-3) 28%, transparent), transparent 45%),
      radial-gradient(circle at 15% 80%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 40%),
      var(--bg);
  }
  .mesh::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .num { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { text-wrap: balance; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  svg { display: block; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  /* ---------- shell ---------- */
  .shell { display: flex; min-height: 100vh; width: 100%; }
  .sidebar {
    width: 232px; flex-shrink: 0; background: var(--sidebar-bg); backdrop-filter: blur(28px) saturate(1.7);
    -webkit-backdrop-filter: blur(28px) saturate(1.7); border-right: 1px solid var(--glass-border);
    position: sticky; top: 0; align-self: flex-start; height: 100vh;
    display: flex; flex-direction: column; z-index: 20;
  }
  .sidebar-header { padding: 22px 20px 14px; }
  .sidebar-header .mark { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 650; font-size: 15px; }
  .sidebar-header .mark .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(53,213,115,.25); }
  .sidebar-header .sub { color: var(--sidebar-text); font-size: 12px; margin-top: 3px; padding-left: 19px; }
  .nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    all: unset; box-sizing: border-box; cursor: pointer; color: var(--sidebar-text); font-size: 13.5px; font-weight: 500;
    padding: 9px 12px; border-radius: 12px; display: flex; align-items: center; gap: 11px;
    transition: background .15s ease, color .15s ease;
  }
  .nav button svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav button.active { background: var(--sidebar-active-bg); color: var(--sidebar-text-active); }
  .nav button.active svg { opacity: 1; }
  .sidebar-footer { padding: 14px; border-top: 1px solid var(--glass-border); }
  .sidebar-footer button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%; color: var(--sidebar-text); font-size: 13px;
    padding: 9px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px;
  }
  .sidebar-footer button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .sidebar-footer button svg { width: 16px; height: 16px; }

  .main { flex: 1; min-width: 0; }
  .topbar { padding: 22px clamp(16px,3vw,36px) 4px; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: clamp(22px,2.4vw,28px); }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--success-soft); color: var(--success);
    font-size: 12.5px; font-weight: 650; padding: 5px 12px 5px 9px; border-radius: 999px;
  }
  .live-badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 1.4s infinite; }
  .live-badge.danger { background: var(--danger-soft); color: var(--danger); }
  .live-badge.danger .pulse { background: var(--danger); }
  .live-badge.clickable { cursor: pointer; border: none; font-family: inherit; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .page { padding: 18px clamp(16px,3vw,36px) 60px; max-width: 1600px; margin: 0 auto; }

  /* ---------- glass primitives ---------- */
  .card {
    background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); margin-bottom: 20px; backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
  }
  .card-head { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { font-size: 16px; }
  .card-body { padding: 0 24px 24px; }
  .card-body.pad-top { padding-top: 24px; }

  .segmented { display: inline-flex; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 999px; border: 1px solid var(--glass-border); }
  .segmented button { all: unset; box-sizing: border-box; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; color: var(--text-2); }
  .segmented button.active { background: var(--glass-bg-strong); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--surface-2);
    color: var(--text); cursor: pointer; transition: transform .12s ease, background .15s ease, opacity .15s;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn:hover { background: var(--glass-bg-strong); }
  .btn:active, .btn.btn-pressed { transform: scale(.93); filter: brightness(.88); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
  .btn-accent:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: .88; }
  .btn-ghost { background: transparent; border-color: transparent; padding: 6px 10px; color: var(--accent); }
  .btn-ghost.danger { color: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn-icon { padding: 8px; border-radius: 999px; }

  input[type=text], input[type=tel], input[type=search], input[type=password], select, textarea {
    font-family: inherit; font-size: 14px; padding: 10px 13px; border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border); background: var(--surface-2); color: var(--text); width: 100%;
  }
  /* ตัว <select> ปิดอยู่ใช้ --surface-2 (โปร่งแสง) ได้เพราะวางทับพื้นหลังของหน้าเว็บเองอยู่แล้ว
     แต่รายการตัวเลือกที่กางออกมาเป็น popup ระดับ OS แยกจากพื้นหลังของหน้าเว็บ สีโปร่งแสงเลยจาง/มองไม่ออก
     ต้องใช้สีทึบ (--surface-solid) แทน ถึงจะอ่านออกชัดเจนไม่ว่าเบราว์เซอร์ไหน */
  select option { background: var(--surface-solid); color: var(--text); }
  select option:disabled { color: var(--text-3); }
  input::placeholder, textarea::placeholder { color: var(--text-3); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.55; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--text-2); font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
  .search-wrap { position: relative; flex: 1; min-width: 160px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-3); }
  .search-wrap input { padding-left: 34px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 650; padding: 0 10px 10px; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .sort-ind { font-size: 10px; color: var(--accent); margin-left: 3px; }
  td { padding: 13px 10px; border-top: 1px solid var(--glass-border); font-size: 13.5px; vertical-align: middle; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: rgba(255,255,255,.15); }
  .table-scroll { overflow-x: auto; }
  .empty { text-align: center; color: var(--text-3); padding: 40px 20px; font-size: 13.5px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.interested, .pill.called, .pill.active { background: var(--success-soft); color: var(--success); }
  .pill.not_interested, .pill.angry, .pill.deleted, .pill.failed, .pill.blocked { background: var(--danger-soft); color: var(--danger); }
  .pill.callback { background: var(--warning-soft); color: var(--warning); }
  .pill.no_answer, .pill.pending, .pill.paused, .pill.busy, .pill.canceled, .pill.no_conversation { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--glass-border); }
  .pill.completed, .pill.connected, .pill.retry_pending { background: var(--accent-soft); color: var(--accent); }
  .pill.script-count { background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 700; padding: 8px 18px; }

  .switch { position: relative; display: inline-block; width: 42px; height: 25px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--glass-border); border-radius: 999px; transition: background .18s ease; cursor: pointer; }
  .switch .track::before { content: ""; position: absolute; width: 19px; height: 19px; left: 2px; top: 2px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s ease; }
  .switch input:checked + .track { background: var(--success); }
  .switch input:checked + .track::before { transform: translateX(17px); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid var(--glass-border); font-size: 13.5px; }
  .switch-row:first-of-type { border-top: none; }

  /* ---------- stat tiles ---------- */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-tile { background: var(--glass-bg); backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 18px 20px; }
  .stat-tile .label { font-size: 12.5px; color: var(--text-2); font-weight: 600; margin-bottom: 8px; }
  .stat-tile .value { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  .stat-tile .value.accent { color: var(--accent); }
  .stat-tile .value.success { color: var(--success); }
  .stat-tile .value.warning { color: var(--warning); }

  /* ---------- gradient campaign cards ---------- */
  .campaign-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .gcard {
    position: relative; overflow: hidden; border-radius: var(--radius-lg); padding: 20px; min-height: 158px;
    color: #fff; display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 16px 40px -12px rgba(20,10,60,.35); cursor: pointer; transition: transform .18s ease;
  }
  .gcard:hover { transform: translateY(-3px); }
  .gcard::after {
    content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.35) 1px, transparent 0);
    background-size: 14px 14px;
  }
  .gcard.g0 { background: linear-gradient(135deg, #6a5cff 0%, #17c3e6 100%); }
  .gcard.g1 { background: linear-gradient(135deg, #ff8a65 0%, #ffce54 100%); }
  .gcard.g2 { background: linear-gradient(135deg, #17c3e6 0%, #6a5cff 100%); }
  .gcard.g3 { background: linear-gradient(135deg, #ff6fa8 0%, #ff9ecf 100%); }
  .gcard.dim { filter: saturate(.55) brightness(.8); }
  .gcard .top-row { display: flex; justify-content: space-between; align-items: flex-start; z-index: 1; position: relative; }
  .gcard .chip { width: 32px; height: 24px; border-radius: 6px; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; }
  .gcard .chip svg { width: 15px; height: 15px; }
  .gcard .pill { background: rgba(255,255,255,.24); color: #fff; }
  .gcard .name { font-size: 15px; font-weight: 650; z-index: 1; position: relative; margin: 14px 0 8px; }
  .gcard .stats { display: flex; gap: 18px; z-index: 1; position: relative; margin-bottom: 10px; }
  .gcard .stats.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .gcard .stats .n { font-size: 19px; font-weight: 700; }
  .gcard .stats .l { font-size: 10.5px; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
  .gcard .progress { height: 5px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; z-index: 1; position: relative; }
  .gcard .progress-fill { height: 100%; background: rgba(255,255,255,.85); border-radius: 999px; }
  .gcard .conv-line { font-size: 11px; opacity: .85; z-index: 1; position: relative; }
  .campaign-strip-empty { padding: 28px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
  .campaign-strip-empty .btn { margin-top: 10px; }

  /* ---------- glow hero ---------- */
  .glow-hero {
    position: relative; border-radius: var(--radius-lg); padding: 22px 24px; overflow: hidden;
    background: linear-gradient(160deg, rgba(20,18,32,.92), rgba(10,9,18,.96)); color: #fff;
    box-shadow: var(--shadow-pop); margin-bottom: 20px;
  }
  .glow-hero::before {
    content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px; z-index: 0;
    background: conic-gradient(from 0deg, #6a5cff, #17c3e6, #ff9ecf, #ffce54, #6a5cff);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .85; filter: blur(.4px);
    animation: spin 7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .glow-hero::before { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .glow-hero .inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .glow-hero h3 { font-size: 17px; margin-bottom: 4px; }
  .glow-hero p { font-size: 12.5px; color: rgba(255,255,255,.6); }
  .glow-hero .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); color: #fff; }
  .glow-hero .btn:hover { background: rgba(255,255,255,.2); }
  .idle-hero {
    border-radius: var(--radius-lg); padding: 18px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
    color: var(--text-2); font-size: 13.5px; background: var(--glass-bg); border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(1.5);
  }

  /* ---------- chart ---------- */
  .chart-wrap { position: relative; }
  .chart-annot {
    position: absolute; top: 14px; background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 650; backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 5px; box-shadow: var(--shadow-card);
  }
  .chart-annot .d { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .bar-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .bar-label { width: 150px; flex-shrink: 0; font-size: 13px; color: var(--text-2); line-height: 1.3; }
  .bar-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .bar-value { width: 34px; text-align: right; font-size: 13px; font-weight: 650; flex-shrink: 0; }

  .qa-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--glass-border); cursor: pointer; }
  .qa-row:first-child { border-top: none; }
  .qa-row .badge { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .qa-row .badge svg { width: 16px; height: 16px; }
  .qa-row .label { flex: 1; font-size: 13.5px; font-weight: 600; }
  .qa-row .chev { color: var(--text-3); width: 16px; height: 16px; }
  .qa-row:hover .label { color: var(--accent); }

  .import-zone {
    width: 100%; min-height: 130px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px;
    border: 1.5px dashed var(--glass-border); background: var(--surface-2); border-radius: var(--radius-sm);
    padding: 12px 14px; resize: vertical; line-height: 1.6; color: var(--text);
  }
  .import-zone:focus { border-style: solid; border-color: var(--accent); outline: none; }
  .import-summary { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--text-2); margin: 10px 0; flex-wrap: wrap; }
  .import-summary b.ok { color: var(--success); } .import-summary b.bad { color: var(--danger); }
  .import-preview { max-height: 220px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); }
  .import-preview table { font-size: 12.5px; }
  .import-preview td { padding: 8px 10px; }
  .row-invalid td { opacity: .45; text-decoration: line-through; }
  .tab-toggle { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; border: 1px solid var(--glass-border); margin-bottom: 14px; width: fit-content; }
  .tab-toggle button { all: unset; box-sizing: border-box; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 8px; color: var(--text-2); }
  .tab-toggle button.active { background: var(--glass-bg-strong); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tab-panel { display: none; } .tab-panel.active { display: block; }

  /* ---------- modal + confirm + toast ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(10,8,20,.45); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--glass-bg-strong); backdrop-filter: blur(30px) saturate(1.6); border-radius: var(--radius-lg); width: 100%; max-width: 680px; max-height: 84vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-pop); border: 1px solid var(--glass-border); animation: pop .18s cubic-bezier(.2,.9,.3,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.96) } to { opacity: 1; transform: scale(1) } }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-head h3 { font-size: 16px; }
  .modal-head .sub { font-size: 12.5px; color: var(--text-2); margin-top: 3px; }
  .modal-close { all: unset; box-sizing: border-box; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: 8px; }
  .modal-close:hover { background: var(--surface-2); color: var(--text); }
  .modal-meta { padding: 14px 22px; background: var(--surface-2); border-bottom: 1px solid var(--glass-border); display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
  .modal-meta .k { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
  .modal-meta .v { font-size: 13.5px; font-weight: 600; }
  /* ข้อความยาว (สรุป/ประเด็นสำคัญ/สิ่งที่ควรทำต่อ) แยกออกมาเป็น block เต็มความกว้าง ไม่บีบอยู่ใน grid แคบๆ ของ .modal-meta */
  .modal-notes { padding: 14px 22px; background: var(--surface-2); border-bottom: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 12px; }
  .note-block .k { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 5px; }
  .note-block .v { font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .modal-messages { padding: 18px 22px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 74%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; }
  .bubble.ai { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--glass-border); border-bottom-left-radius: 5px; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 5px; }
  .bubble-label { font-size: 10px; opacity: .6; margin-bottom: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

  .confirm-box { background: var(--glass-bg-strong); backdrop-filter: blur(30px); border-radius: var(--radius-md); width: 100%; max-width: 340px; padding: 24px 22px 18px; text-align: center; box-shadow: var(--shadow-pop); border: 1px solid var(--glass-border); animation: pop .18s cubic-bezier(.2,.9,.3,1); }
  .confirm-icon { width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; }
  .confirm-icon.danger { background: var(--danger-soft); color: var(--danger); }
  .confirm-icon.safe { background: var(--accent-soft); color: var(--accent); }
  .confirm-icon svg { width: 22px; height: 22px; }
  .confirm-box h3 { font-size: 15.5px; margin-bottom: 6px; }
  .confirm-box p { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 18px; }
  .confirm-actions { display: flex; gap: 10px; }
  .confirm-actions .btn { flex: 1; justify-content: center; }

  .toast-stack { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { display: flex; align-items: center; gap: 8px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow-pop); animation: toastin .22s cubic-bezier(.2,.9,.3,1); }
  .toast svg { width: 15px; height: 15px; flex-shrink: 0; }
  .toast.success svg { color: var(--success); }
  .toast.danger svg { color: #ff8a80; }
  .toast-action { all: unset; box-sizing: border-box; cursor: pointer; text-decoration: underline; font-weight: 700; margin-left: 6px; color: inherit; flex-shrink: 0; }
  @keyframes toastin { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }

  ::selection { background: var(--accent-soft); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* ---------- login ---------- */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--sidebar-bg); position: relative; }
  .login-box { background: var(--glass-bg-strong); backdrop-filter: blur(30px) saturate(1.6); padding: 36px 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); width: 320px; text-align: center; border: 1px solid var(--glass-border); position: relative; z-index: 1; }
  .login-box h1 { font-size: 17px; margin-bottom: 4px; color: #fff; }
  .login-box .sub { font-size: 12px; color: rgba(255,255,255,.6); margin-bottom: 20px; }
  .login-box input { width: 100%; margin-bottom: 12px; }
  .login-box button { width: 100%; }
  #app { display: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 1024px) {
    .sidebar { width: 76px; }
    .sidebar .label, .sidebar-header .sub, .sidebar-header .full-name { display: none; }
    .sidebar-header { padding: 20px 0 14px; display: flex; justify-content: center; }
    .sidebar-header .mark { flex-direction: column; gap: 4px; }
    .nav button { justify-content: center; padding: 12px; }
    .sidebar-footer button { justify-content: center; padding: 12px; }
  }
  @media (max-width: 680px) {
    .shell { flex-direction: column; }
    .sidebar {
      position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: auto;
      flex-direction: row; border-right: none; border-top: 1px solid var(--glass-border); z-index: 40;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sidebar-header, .sidebar-footer { display: none; }
    .nav { flex-direction: row; justify-content: space-around; padding: 8px; }
    .nav button { flex-direction: column; gap: 3px; font-size: 10px; padding: 6px 8px; }
    .nav button svg { width: 20px; height: 20px; }
    .main { padding-bottom: 70px; }
    .topbar { padding: 18px 16px 4px; }
    .page { padding: 14px 16px 40px; }
    .grid-2 { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .modal-meta { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="mesh"></div>

<div id="loginScreen">
  <div class="login-box">
    <h1>Call AI — Control Center</h1>
    <div class="sub">กรอกรหัสผ่านเพื่อเข้าใช้งาน</div>
    <input type="password" id="loginPassword" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter') login()">
    <button class="btn btn-accent" onclick="login()">เข้าสู่ระบบ</button>

  </div>
</div>

<div id="app">

      <div class="sidebar-header">
        <div class="mark"><span class="dot"></span> <span class="full-name">Call AI</span></div>
        <div class="sub">Control Center</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="label">ออกจากระบบ</span>
        </button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="row" style="gap:8px">
          <button class="live-badge clickable" id="healthPill" onclick="openHealthModal()"><span class="pulse"></span> กำลังตรวจสอบ...</button>
          <span class="live-badge" id="activeBadge"><span class="pulse"></span> <span id="activeCount">0</span> สายที่กำลังคุยอยู่</span>
        </div>
      </div>
      <div class="page" id="pageContent"></div>
    </div>
  </div>
</div>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="modalTitle"></h3><div class="sub" id="modalSubtitle"></div></div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-notes" id="modalNotes"></div>
    <div id="modalRecording"></div>
    <div class="modal-messages" id="modalMessages"></div>
  </div>
</div>

<div class="overlay" id="contactEditOverlay">
  <div class="modal" style="max-width:520px">
    <div class="modal-head">
      <div><h3>แก้ไขเบอร์ติดต่อ</h3></div>
      <button class="modal-close" onclick="closeContactEditModal()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 22px" id="contactEditModalBody"></div>
  </div>
</div>

<div class="overlay" id="campaignEditOverlay">
  <div class="modal" style="max-width:720px">
    <div class="modal-head">
      <div><h3 id="campaignEditModalTitle"></h3></div>
      <button class="modal-close" onclick="closeCampaignEditModal()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:20px 22px; overflow-y:auto" id="campaignEditModalBody"></div>
  </div>
</div>

<div class="overlay" id="confirmOverlay"></div>
<div class="toast-stack" id="toastStack"></div>

<script>
/* ==================== icons ==================== */
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
  campaigns: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3 5 1-.5-2-4.5h6l6 4V5l-6 4H6a2 2 0 0 0-2 2Z"/><path d="M15 9v6"/></svg>',
  contacts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  test: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  hangup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.86.32 1.76.55 2.68.68A2 2 0 0 1 22 16.92V19a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2 3.18 2 2 0 0 1 4 1h2.09a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  waveform: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="10" x2="3" y2="14"/><line x1="7" y1="6" x2="7" y2="18"/><line x1="11" y1="2" x2="11" y2="22"/><line x1="15" y1="6" x2="15" y2="18"/><line x1="19" y1="10" x2="19" y2="14"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>',

  block: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg>',
}
const icon = (name, cls) => `<span class="${cls||''}" style="display:inline-flex">${ICONS[name]||''}</span>`
const HANGUP_LABELS = { ai_ended: 'AI ปิดสายปกติ', customer_hangup: 'ลูกค้าวางสายเอง', silence_timeout: 'หมดเวลาเงียบ ไม่ตอบสนอง', manual_hangup: 'เจ้าหน้าที่ตัดสาย (ปุ่มฉุกเฉิน)', max_duration: 'ครบเวลาสูงสุดของสาย' }
const CALL_STATUS_LABELS = { completed: 'เชื่อมสายสำเร็จ', 'no-answer': 'ไม่รับสาย', busy: 'สายไม่ว่าง', failed: 'โทรไม่ติด', canceled: 'ยกเลิกก่อนโทร' }
// sent/failed มาจาก postCall.js ตอนส่งจริง — ค่าอื่นๆ (เช่น delivery) มาจาก DR ที่ ThaiBulkSMS ยิงกลับมาทีหลัง
// ยังไม่รู้ค่าที่เป็นไปได้ทั้งหมดจากเอกสาร ThaiBulkSMS เลย fallback โชว์ค่าดิบตรงๆ ถ้าไม่ตรงกับที่ map ไว้
const SMS_STATUS_LABELS = { sent: 'ส่งแล้ว (รอผลส่งถึง)', delivery: 'ถึงมือลูกค้าแล้ว', failed: 'ส่งไม่สำเร็จ' }
function smsStatusBadge(status){
  const cls = status === 'failed' ? 'danger' : (status === 'delivery' ? 'success' : 'warning')
  return `<span class="pill" style="background:var(--${cls}-soft); color:var(--${cls})">${esc(SMS_STATUS_LABELS[status] || status)}</span>`
}
// ผลของบทสนทนา (ต่างจาก call_status ที่บอกแค่ว่าเชื่อมสายได้ไหม) — บางค่าซ้ำกับ call_status ได้

const OUTCOME_LABELS = {

/* ==================== auth / fetch ==================== */
let token = localStorage.getItem('callai_token') || null

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML }
// สำหรับค่าที่ถูกฝังใน onclick="fn('...')" — esc() เพียงอย่างเดียวไม่ escape ' หรือ " จึงหลุดออกจาก string/attribute ได้ถ้าค่ามี apostrophe (เช่น ชื่อลูกค้า "O'Brien")
function escJsAttr(s){ const jsEscaped = (s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); return esc(jsEscaped).replace(/"/g,'&quot;') }
// สำหรับข้อความที่ฝังใน attribute ธรรมดา เช่น title="..." — esc() ไม่ escape เครื่องหมายคำพูดคู่
function escAttr(s){ return esc(s).replace(/"/g,'&quot;') }
function fmtDur(sec){ sec=Number(sec)||0; const m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}` }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return iso; return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d) }
function campaignName(id){ if(!id) return '—'; const c = campaignsCache.find(x => x.id === id); return c ? (c.name || c.id) : id }

// เรียงลำดับแถวตามคอลัมน์ที่คลิก — ใช้ร่วมกันทั้งตารางประวัติการโทรและตารางเบอร์ติดต่อ
// numericKeys/dateKeys ระบุไว้ล่วงหน้าเพราะเทียบแบบตัวเลข/วันที่ตรงๆ ต้องคนละวิธีกับเทียบตัวอักษร (localeCompare ภาษาไทย)
const SORT_NUMERIC_KEYS = new Set(['duration', 'retry_count'])
const SORT_DATE_KEYS = new Set(['timestamp'])
function sortRows(rows, sortState, resolveValue){
  if (!sortState.key) return rows
  const { key, dir } = sortState
  return [...rows].sort((a, b) => {
    let av = resolveValue ? resolveValue(a, key) : a[key]
    let bv = resolveValue ? resolveValue(b, key) : b[key]
    if (SORT_NUMERIC_KEYS.has(key)) return ((Number(av) || 0) - (Number(bv) || 0)) * dir
    if (SORT_DATE_KEYS.has(key)) return String(av || '').localeCompare(String(bv || '')) * dir
    return String(av || '').localeCompare(String(bv || ''), 'th') * dir
  })
}
// อัปเดตลูกศร ▲/▼ ให้โชว์เฉพาะคอลัมน์ที่กำลังเรียงอยู่ — theadId คือ id ของ <thead> ที่มี .sort-ind อยู่ข้างใน
function updateSortIndicators(theadId, sortState){
  const thead = document.getElementById(theadId)
  if (!thead) return
  thead.querySelectorAll('.sort-ind').forEach(el => {
    el.textContent = el.dataset.key === sortState.key ? (sortState.dir === 1 ? ' ▲' : ' ▼') : ''
  })
}

async function apiFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token })
  if (options.body && typeof options.body !== 'string') {
    options.headers['Content-Type'] = 'application/json'
    options.body = JSON.stringify(options.body)
  }
  const res = await fetch(url, options)
  if (res.status === 401) {
    token = null
    localStorage.removeItem('callai_token')
    showLogin()
    throw new Error('Unauthorized')
  }
  return res
}

// เพิ่ม feedback ตอนกดปุ่ม แบบ delegate เดียวจบ — กัน render ทับปุ่มทันทีหลังกด (innerHTML rebuild)
// จนแอนิเมชัน :active ของ CSS เล่นไม่ทัน เพราะปุ่มโดนแทนที่ก่อนตาเห็น
document.addEventListener('pointerdown', e => {
  const btn = e.target.closest('.btn')
  if (!btn) return
  btn.classList.add('btn-pressed')
  setTimeout(() => btn.classList.remove('btn-pressed'), 160)
})

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex'
  document.getElementById('app').style.display = 'none'
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  buildNav()
  refreshActiveGlobal()
  pollHealth()
  render()
}

async function login() {
  const password = document.getElementById('loginPassword').value
  const errEl = document.getElementById('loginError')
  errEl.textContent = ''
  try {
    const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) })
    const data = await res.json()
    if (!res.ok) { errEl.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ'; return }
    token = data.token
    localStorage.setItem('callai_token', token)
    showApp()
  } catch (e) { errEl.textContent = 'เชื่อมต่อไม่ได้' }
}
async function logout() {
  try { await apiFetch('/api/auth/logout', { method: 'POST' }) } catch (e) {}
  token = null
  localStorage.removeItem('callai_token')
  showLogin()
}

/* ==================== toast / confirm / modal ==================== */
// action = { label, onClick } (ไม่บังคับ) — ใส่แล้วโชว์ปุ่มเล็กๆ ในตัว toast เอง เช่น "เลิกทำ" พร้อมยืดเวลาก่อนหายไปให้กดทัน
function toast(msg, type='success', action=null){
  const stack = document.getElementById('toastStack')
  const el = document.createElement('div')
  el.className = 'toast ' + type
  el.innerHTML = icon(type==='danger'?'warn':'check') + `<span>${esc(msg)}</span>`
  const dismiss = () => { el.style.transition='opacity .2s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 200) }
  if (action) {
    const btn = document.createElement('button')
    btn.className = 'toast-action'
    btn.textContent = action.label
    btn.onclick = () => { dismiss(); action.onClick() }
    el.appendChild(btn)
  }
  stack.appendChild(el)
  setTimeout(dismiss, action ? 8000 : 2600)
}
function openConfirm({title, message, confirmLabel='ยืนยัน', danger=true, extraHtml='', onConfirm}){
  const ov = document.getElementById('confirmOverlay')
  ov.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-icon ${danger?'danger':'safe'}">${icon(danger?'warn':'check')}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      ${extraHtml}
      <div class="confirm-actions">
        <button class="btn" onclick="document.getElementById('confirmOverlay').classList.remove('open')">ยกเลิก</button>
        <button class="btn ${danger?'btn-danger':'btn-accent'}" id="confirmYes">${esc(confirmLabel)}</button>
      </div>
    </div>`
  ov.classList.add('open')
  document.getElementById('confirmYes').onclick = async () => { ov.classList.remove('open'); await onConfirm() }
}
function closeModal(){ stopLivePolling(); document.getElementById('modalOverlay').classList.remove('open') }
let liveModalTimer = null
function stopLivePolling(){ if(liveModalTimer){ clearInterval(liveModalTimer); liveModalTimer = null } }

function parseTranscript(str){
  if (!str) return []
  return str.split(' | ').map(turn => {
    const idx = turn.indexOf(': ')
    if (idx === -1) return { role: 'ai', text: turn }
    const label = turn.slice(0, idx)
    return { role: label === 'ลูกค้า' ? 'user' : 'ai', text: turn.slice(idx + 2) }
  })
}
function renderBubbles(turns){
  if (!turns.length) return `<div class="empty">ยังไม่มีบทสนทนา</div>`
  return turns.map(t => `<div class="bubble ${t.role}"><div class="bubble-label">${t.role==='user'?'ลูกค้า':'AI'}</div><div>${esc(t.text)}</div></div>`).join('')
}

    ${c.sms_status ? `<div><div class="k">SMS follow-up</div><div class="v">${smsStatusBadge(c.sms_status)}</div></div>` : ''}`
  const notes = [

  ].filter(([, v]) => v && v.trim())

  document.getElementById('modalMessages').innerHTML = renderBubbles(parseTranscript(c.transcript))

function renderRecordingSlot(recordingUrl){
  const el = document.getElementById('modalRecording')
  if (!recordingUrl) { el.innerHTML = ''; return }
  el.innerHTML = `<div class="row" style="align-items:center; gap:8px; margin:10px 0"><span style="font-size:12px; color:var(--text-2)">🎧 บันทึกเสียงสาย</span><span id="recordingStatus" style="font-size:12px; color:var(--text-3)">กำลังโหลด...</span></div>`
  loadRecording(recordingUrl)
}
async function loadRecording(recordingUrl){
  const statusEl = document.getElementById('recordingStatus')
  try {
    const res = await apiFetch('/api/recordings/proxy?url=' + encodeURIComponent(recordingUrl))
    if (!res.ok) throw new Error('fetch failed')
    const blob = await res.blob()
    const el = document.getElementById('modalRecording')
    if (!el) return // ปิด modal ไปแล้วระหว่างโหลด
    el.innerHTML = `<audio controls style="width:100%; margin:10px 0" src="${URL.createObjectURL(blob)}"></audio>`
  } catch (e) {
    if (statusEl) statusEl.textContent = 'โหลดไฟล์เสียงไม่สำเร็จ'
  }
}
async function loadLiveMessages(callSid){
  try {
    const res = await apiFetch(`/api/calls/active/${encodeURIComponent(callSid)}`)
    if (!res.ok) { stopLivePolling(); return }
    const data = await res.json()
    document.getElementById('modalSubtitle').textContent = 'กำลังคุยอยู่ · ' + fmtDur(data.duration)
    const turns = (data.messages || []).map(m => ({ role: m.role === 'user' ? 'user' : 'ai', text: m.content }))
    document.getElementById('modalMessages').innerHTML = renderBubbles(turns)
  } catch (e) {}
}
function openLiveModal(callSid, phone, name){
  stopLivePolling()
  document.getElementById('modalTitle').textContent = `${name || ''} — ${phone || ''}`
  document.getElementById('modalMeta').innerHTML = `<div><div class="k">สถานะ</div><div class="v" style="color:var(--success)">● กำลังคุยอยู่สด</div></div>`
  document.getElementById('modalNotes').innerHTML = ''
  document.getElementById('modalRecording').innerHTML = ''
  document.getElementById('modalMessages').innerHTML = '<div class="empty">กำลังโหลด...</div>'
  document.getElementById('modalOverlay').classList.add('open')
  loadLiveMessages(callSid)
  liveModalTimer = setInterval(() => loadLiveMessages(callSid), 3000)
}

const PAGES = ['dashboard','campaigns','numbers','contacts','test','history','lookup','sms','senders']
const TITLES = { dashboard:'Dashboard', campaigns:'Campaigns', numbers:'จัดการเบอร์', contacts:'เบอร์ติดต่อ', test:'ทดสอบ', history:'ประวัติการโทร', lookup:'ค้นหาเบอร์', sms:'SMS Templates', senders:'Sender Names' }
const NAV_ICON = { dashboard:'dashboard', campaigns:'campaigns', numbers:'phone', contacts:'contacts', test:'test', history:'history', lookup:'search', sms:'chat', senders:'sheet' }

function buildNav(){
  document.getElementById('nav').innerHTML = PAGES.map(p =>
    `<button data-p="${p}" onclick="go('${p}')">${icon(NAV_ICON[p])}<span class="label">${TITLES[p]}</span></button>`
  ).join('')
}
function go(page){ location.hash = '#/' + page }
window.addEventListener('hashchange', render)
function currentPage(){ const h = location.hash.replace(/^#\/?/,'') || 'dashboard'; return PAGES.includes(h) ? h : 'dashboard' }

function render(){
  const p = currentPage()
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.p === p))
  document.getElementById('pageTitle').textContent = TITLES[p]
  document.getElementById('pageContent').innerHTML = TEMPLATES[p]()
  INIT[p] && INIT[p]()
}

/* ==================== campaigns ==================== */
function populateCampaignSelects(){
  document.querySelectorAll('.campaign-select').forEach(sel => {
    const current = sel.value
    const keepFirst = sel.options[0]
    sel.innerHTML = ''
    sel.appendChild(keepFirst)
    campaignsCache.forEach(c => {
      const opt = document.createElement('option')
      opt.value = c.id
      opt.text = c.name || c.id
      sel.appendChild(opt)
    })
    sel.value = current
  })
}
async function loadCampaigns(){
  const res = await apiFetch('/api/campaigns')
  campaignsCache = await res.json()
  populateCampaignSelects()
  renderCampaignTable()
}
// เบอร์ที่ลงทะเบียนไว้ในระบบนี้ (หน้า "จัดการเบอร์") — ใช้ร่วมกันหลายหน้า (Dashboard, เบอร์ติดต่อ, ทดสอบ, ประวัติการโทร)
let twilioNumbersCache = []
async function loadTwilioNumbers(){
  try {
    const res = await apiFetch('/api/twilio-numbers')
    twilioNumbersCache = res.ok ? await res.json() : []
  } catch (e) {
    twilioNumbersCache = []
  }
  populateTwilioNumberSelects()
}
// เบอร์ดิบทั้งหมดในบัญชี Twilio จริง — ใช้เฉพาะตอนเพิ่มเบอร์ใหม่ในหน้า "จัดการเบอร์" (ให้เลือกจากของจริง กัน typo)
let twilioAccountNumbersCache = []
async function loadTwilioAccountNumbers(){
  try {
    const res = await apiFetch('/api/twilio/numbers')
    twilioAccountNumbersCache = res.ok ? await res.json() : []
  } catch (e) {
    twilioAccountNumbersCache = []
  }
}
// เติม <select class="twilio-number-select"> ทุกตัวที่มีอยู่ตอนนี้ในหน้า — เหมือน populateCampaignSelects()
function populateTwilioNumberSelects(){
  document.querySelectorAll('.twilio-number-select').forEach(sel => {
    const current = sel.value
    const keepFirst = sel.options[0]
    sel.innerHTML = ''
    sel.appendChild(keepFirst)
    twilioNumbersCache.forEach(n => {
      const opt = document.createElement('option')
      opt.value = n.phone_number
      opt.text = n.label ? `${n.label} (${n.phone_number})` : n.phone_number
      sel.appendChild(opt)
    })
    sel.value = current
  })
}
// โชว์ label ที่ตั้งไว้แทนเบอร์ดิบถ้ามี — ใช้ในตาราง/รายละเอียดประวัติการโทร
function twilioNumberLabel(number){
  if (!number) return '—'
  const n = twilioNumbersCache.find(x => x.phone_number === number)
  return (n && n.label) ? n.label : number
}
function renderCampaignTable(){
  const tbody = document.getElementById('campaignTable')
  if (!tbody) return

// หา id ถัดไปที่ยังไม่ถูกใช้ จากรูปแบบ campNN ที่มีอยู่ — แค่คำแนะนำเริ่มต้น ผู้ใช้แก้เองได้เสมอ
function nextCampaignId(){
  const nums = campaignsCache
    .map(c => (c.id || '').match(/^camp(\d+)$/))
    .filter(Boolean)
    .map(m => parseInt(m[1], 10))
  const next = (nums.length ? Math.max(...nums) : 0) + 1
  return 'camp' + String(next).padStart(2, '0')
}

// ดึงเบอร์สดจาก server เสมอ (ไม่ใช้ contactsCache) — contactsCache ว่างเปล่าถ้ายังไม่เคยเปิดหน้าเบอร์ติดต่อในเซสชันนี้เลย
// ซึ่งจะทำให้เข้าใจผิดว่าไม่มีเบอร์ค้าง ทั้งที่มีจริง (backend ยังกันไว้อยู่ แต่ UI จะไม่โชว์ตัวเลือกจัดการให้)
// นับทั้ง pending และ retry_pending (เบอร์รอโทรซ้ำ) — ให้ตรงกับที่ backend เช็คก่อนลบ ไม่งั้น UI กับ backend จะไม่ตรงกัน
async function confirmDeleteCampaign(id){
  const c = campaignsCache.find(x => x.id === id)
  const contactsRes = await apiFetch(`/api/contacts?campaignId=${encodeURIComponent(id)}`)
  const contactsInCampaign = contactsRes.ok ? await contactsRes.json() : []
  const pending = contactsInCampaign.filter(x => x.status === 'pending' || x.status === 'retry_pending')
  const otherCampaigns = campaignsCache.filter(x => x.id !== id)

  // เช็คสดจาก server เสมอเหมือน pending contacts ด้านบน — เบอร์ที่ผูก campaign นี้ไว้ (หน้า "จัดการเบอร์") จะเลิกผูกอัตโนมัติตอนลบ
  const numbersRes = await apiFetch('/api/twilio-numbers')
  const boundNumbers = numbersRes.ok ? (await numbersRes.json()).filter(n => n.campaign_id === id) : []

  let extraHtml = boundNumbers.length
    ? `<p style="text-align:left; font-size:12.5px; color:var(--text-2); margin-top:6px">เบอร์ <b>${boundNumbers.map(n => esc(n.label || n.phone_number)).join(', ')}</b> ผูกกับ Campaign นี้อยู่ (หน้า "จัดการเบอร์") — ลบแล้วจะเลิกผูกอัตโนมัติ เบอร์นั้นจะรับสายเข้า/ใช้เป็นเบอร์เริ่ม campaign นี้อัตโนมัติไม่ได้อีกจนกว่าจะไปผูกใหม่</p>`
    : ''
  if (pending.length) {
    extraHtml += `
      <div class="field" style="text-align:left; margin-top:6px">
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px">
          <input type="radio" name="delCampaignResolution" value="move" ${otherCampaigns.length ? 'checked' : 'disabled'}>
          ย้ายเบอร์เหล่านี้ไป Campaign อื่น
        </label>
        <select id="delCampaignTarget" style="width:100%; margin:0 0 12px 26px; max-width:calc(100% - 26px)" ${otherCampaigns.length ? '' : 'disabled'}>
          ${otherCampaigns.length
            ? otherCampaigns.map(x => `<option value="${esc(x.id)}">${esc(x.name || x.id)}</option>`).join('')
            : '<option value="">— ไม่มี Campaign อื่น —</option>'}
        </select>
        <label style="display:flex; align-items:center; gap:8px">
          <input type="radio" name="delCampaignResolution" value="cancel" ${otherCampaigns.length ? '' : 'checked'}>
          ปิดเบอร์เหล่านี้ (ยกเลิก ไม่โทรอีก)
        </label>
      </div>`
  }

  openConfirm({
    title: 'ลบ Campaign นี้?',
    message: pending.length
      ? `"${c ? c.name : id}" มีเบอร์ที่ยังไม่เสร็จสิ้น (รอโทร/รอโทรซ้ำ) ${pending.length} เบอร์ผูกอยู่ — เลือกวิธีจัดการก่อนลบ`
      : `"${c ? c.name : id}" จะถูกลบถาวร — เบอร์และประวัติการโทรเก่าที่เคยผูกกับ campaign นี้จะยังอยู่ แต่จะแสดงเป็นรหัส campaign แทนชื่อ`,
    confirmLabel: 'ลบถาวร',
    extraHtml,
    onConfirm: async () => {
      const body = {}
      if (pending.length) {
        body.resolution = document.querySelector('input[name="delCampaignResolution"]:checked')?.value
        if (body.resolution === 'move') body.targetCampaignId = document.getElementById('delCampaignTarget')?.value
      }
      const res = await apiFetch(`/api/campaigns/${encodeURIComponent(id)}`, { method: 'DELETE', body })
      if (!res.ok) { const data = await res.json().catch(()=>({})); toast(data.error || 'ลบไม่สำเร็จ', 'danger'); return }
      toast('ลบ campaign แล้ว', 'danger')
      loadCampaigns()
    }
  })
}

// ข้อความไทย (Unicode) ส่งได้แค่ 70 ตัวอักษร/1 SMS (ไม่ใช่ 160 แบบอังกฤษล้วน) — เกินแล้วโดนตัดส่งเป็นหลายข้อความ = โดนคิดเงินเพิ่มเงียบๆ
function smsSegmentInfo(text){
  const len = text.length
  if (len === 0) return { len: 0, segments: 0, limit: 70 }
  const isUnicode = /[^\x00-\x7F]/.test(text)
  const singleLimit = isUnicode ? 70 : 160
  const multiLimit = isUnicode ? 67 : 153
  const segments = len <= singleLimit ? 1 : Math.ceil(len / multiLimit)
  return { len, segments, limit: segments <= 1 ? singleLimit : multiLimit }
}
function updateSmsPreview(){
  const textEl = document.getElementById('st_text')
  if (!textEl) return
  const text = textEl.value
  const info = smsSegmentInfo(text)
  const countEl = document.getElementById('st_charCount')
  if (countEl) {
    countEl.textContent = info.segments <= 1
      ? `${info.len}/${info.limit} ตัวอักษร — 1 SMS`
      : `${info.len} ตัวอักษร — จะถูกส่งเป็น ${info.segments} SMS (${info.limit} ตัวอักษร/ข้อความ)`
    countEl.style.color = info.segments > 1 ? 'var(--danger)' : 'var(--text-3)'
  }
  const previewEl = document.getElementById('st_preview')
  if (previewEl) previewEl.textContent = text ? text.replace(/\{name\}/g, 'คุณจอร์จ') : '(พิมพ์ข้อความด้านบนเพื่อดูตัวอย่าง)'
}

/* ==================== ช่วงวันที่แบบ from/to+เวลา+เลือกเดือน — ใช้ร่วมกันทั้ง Dashboard และ ประวัติการโทร ==================== */
// คำนวณช่วงวันที่จาก preset ด่วน ("today"/"yesterday"/"7d"/"30d"/"quarter")
function computePresetRange(value){
  const today = new Date()
  let from = new Date(today), to = new Date(today)
  if (value === 'yesterday') { from.setDate(from.getDate() - 1); to = new Date(from) }
  else if (value === '7d') from.setDate(from.getDate() - 6)
  else if (value === '30d') from.setDate(from.getDate() - 29)
  else if (value === 'quarter') from.setDate(from.getDate() - 89)
  // 'today' ไม่ต้องทำอะไรเพิ่ม — from/to เป็นวันนี้อยู่แล้ว
  return { from: localDateStr(from), to: localDateStr(to) }
}
// คำนวณช่วงวันที่ 1 ถึงวันสุดท้ายของเดือนที่เลือก (ถ้าเป็นเดือนปัจจุบัน ใช้วันนี้แทนวันสุดท้าย กันเลือกวันที่ในอนาคต)
function computeMonthRange(value){
  const [y, m] = value.split('-').map(Number)
  const today = new Date()
  const first = new Date(y, m - 1, 1)
  const isCurrentMonth = y === today.getFullYear() && m === today.getMonth() + 1
  const last = isCurrentMonth ? today : new Date(y, m, 0)
  return { from: localDateStr(first), to: localDateStr(last) }
}
// สร้าง <option> ของ dropdown "เลือกเดือน" ย้อนหลัง 12 เดือนจากปัจจุบัน
function buildMonthOptions(){
  const now = new Date()
  const opts = ['<option value="">เลือกเดือน</option>']
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1)
    const value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
    const label = d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' })
    opts.push(`<option value="${escAttr(value)}">${esc(label)}</option>`)
  }
  return opts.join('')
}

/* ==================== dashboard ==================== */
// Dashboard ต้องยึดวันตามเวลาไทย (Asia/Bangkok) เสมอ ไม่ว่า browser ของแอดมินจะเปิดจาก timezone ไหน — ต่างจาก
// localDateStr()/computePresetRange()/computeMonthRange()/buildMonthOptions() ด้านบน ซึ่งใช้เวลา browser local
// และหน้า "ประวัติการโทร" ก็เรียกใช้ฟังก์ชันชุดนั้นร่วมอยู่ด้วย (applyHistoryTimePreset/applyHistoryMonth) — ห้ามแก้
// ชุดนั้นในรอบนี้ เพราะจะเปลี่ยน semantics ของหน้า History ไปด้วยโดยไม่ได้ตั้งใจ จึงแยกชุด Bangkok-specific มาต่างหาก
function bangkokDateKeyFrontend(date){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date)
}
// เลื่อน date key (YYYY-MM-DD) ไปกี่วัน คำนวณบน calendar key ตรงๆ (เหมือน backend bangkokDateKey/shiftDateKey ใน
// googleSheets.js) ไม่ผ่าน Date ของ browser ในโหมด local เพื่อไม่ให้ผลลัพธ์ขึ้นกับ timezone ของเครื่องที่เปิดอยู่
function shiftDateKeyFrontend(dateKey, deltaDays){
  const d = new Date(dateKey + 'T00:00:00Z')
  d.setUTCDate(d.getUTCDate() + deltaDays)
  return d.toISOString().slice(0, 10)
}
function computeDashboardPresetRange(value){
  const today = bangkokDateKeyFrontend(new Date())
  if (value === 'yesterday') { const y = shiftDateKeyFrontend(today, -1); return { from: y, to: y } }
  if (value === '7d') return { from: shiftDateKeyFrontend(today, -6), to: today }
  if (value === '30d') return { from: shiftDateKeyFrontend(today, -29), to: today }
  if (value === 'quarter') return { from: shiftDateKeyFrontend(today, -89), to: today }
  return { from: today, to: today } // 'today'
}
// เดือนปัจจุบัน (เทียบด้วย Bangkok today) ใช้วันนี้แทนวันสุดท้ายของเดือน กันเลือกวันที่ในอนาคต
function computeDashboardMonthRange(value){
  const [y, m] = value.split('-').map(Number)
  const todayKey = bangkokDateKeyFrontend(new Date())
  const [ty, tm] = todayKey.split('-').map(Number)
  const first = `${y}-${String(m).padStart(2, '0')}-01`
  if (y === ty && m === tm) return { from: first, to: todayKey }
  // day 0 ของเดือนถัดไป = วันสุดท้ายของเดือนนี้ (คำนวณบน UTC field ล้วนๆ ไม่ผ่าน local — deterministic)
  const last = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10)
  return { from: first, to: last }
}
// สร้าง <option> ของ dropdown "เลือกเดือน" ของ Dashboard ย้อนหลัง 12 เดือนจาก Bangkok today (แยกจาก buildMonthOptions()
// ที่หน้า History ยังใช้อยู่)
function buildDashboardMonthOptions(){
  const todayKey = bangkokDateKeyFrontend(new Date())
  const [ty, tm] = todayKey.split('-').map(Number)
  const opts = ['<option value="">เลือกเดือน</option>']
  for (let i = 0; i < 12; i++) {
    const d = new Date(Date.UTC(ty, tm - 1 - i, 1))
    const value = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`
    const label = new Intl.DateTimeFormat('th-TH', { year: 'numeric', month: 'long', timeZone: 'UTC' }).format(d)
    opts.push(`<option value="${escAttr(value)}">${esc(label)}</option>`)
  }
  return opts.join('')
}
// ตั้งค่าเริ่มต้นช่องวันที่เป็นวันนี้จริงๆ (ไม่ปล่อยว่าง) + สร้างตัวเลือกใน dropdown "เลือกเดือน"
function initDashboardDateRange(){
  const today = bangkokDateKeyFrontend(new Date())
  const fromEl = document.getElementById('dashDateFrom')
  const toEl = document.getElementById('dashDateTo')
  if (fromEl) fromEl.value = today
  if (toEl) toEl.value = today
  const monthSel = document.getElementById('dashMonthPicker')
  if (monthSel) monthSel.innerHTML = buildDashboardMonthOptions()
}
// dropdown "เวลา" — ปรับช่องจาก/ถึงวันที่ให้ตรงกับตัวเลือกด่วน แล้วค้นหาให้เลย
function applyDashboardTimePreset(value){
  const { from, to } = computeDashboardPresetRange(value)
  document.getElementById('dashDateFrom').value = from
  document.getElementById('dashDateTo').value = to
  document.getElementById('dashMonthPicker').value = ''
  loadStats()
}
// dropdown "เลือกเดือน"
function applyDashboardMonth(value){
  if (!value) return
  const { from, to } = computeDashboardMonthRange(value)
  document.getElementById('dashDateFrom').value = from
  document.getElementById('dashDateTo').value = to
  loadStats()
}
// ปุ่ม "ค้นหา" — ใช้ค่าที่กรอก/แก้เองในช่องจาก-ถึงวันที่ตรงๆ
function applyDashboardDateRange(){
  const from = document.getElementById('dashDateFrom').value
  const to = document.getElementById('dashDateTo').value
  if (!from || !to) { toast('กรอกวันที่ให้ครบทั้งจากและถึง', 'danger'); return }
  if (from > to) { toast('วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด', 'danger'); return }
  loadStats()
}
async function loadStats(days){
  // days='all' (เช่นจากหน้า Campaigns ที่ต้องการยอดสะสมทั้งหมด) ต้องชนะช่องวันที่ของ Dashboard เสมอ
  // และช่อง dashDateFrom/dashDateTo มีอยู่แค่ตอนอยู่หน้า Dashboard เท่านั้น (หน้าอื่นไม่มี element นี้เลย)
  const fromEl = days !== 'all' ? document.getElementById('dashDateFrom') : null
  const toEl = days !== 'all' ? document.getElementById('dashDateTo') : null
  const url = (fromEl?.value && toEl?.value)
    ? `/api/stats?dateFrom=${fromEl.value}&dateTo=${toEl.value}`
    : '/api/stats?days=' + (days === 'all' ? 'all' : (days || 7))
  const res = await apiFetch(url)
  if (!res.ok) { toast('โหลดสถิติไม่สำเร็จ', 'danger'); return }
  statsCache = await res.json()
  const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }

  const grid = document.getElementById('statsGrid')
  if (grid) {
    const sms = statsCache.smsStats || { attempted: 0, delivered: 0, deliveryRate: 0 }
    const smsValue = sms.attempted ? `${sms.deliveryRate}%` : '—'
    const smsSub = sms.attempted ? `${sms.delivered}/${sms.attempted} ข้อความ` : 'ยังไม่มีการส่ง SMS'
    grid.innerHTML = `
      <div class="stat-tile"><div class="label">โทรทั้งหมด</div><div class="value num">${statsCache.total||0}</div></div>
      <div class="stat-tile"><div class="label">สนใจ</div><div class="value num success">${(statsCache.outcomes&&statsCache.outcomes.interested)||0}</div></div>
      <div class="stat-tile"><div class="label">นัด Callback</div><div class="value num warning">${(statsCache.outcomes&&statsCache.outcomes.callback)||0}</div></div>
      <div class="stat-tile"><div class="label">Conversion</div><div class="value num accent">${statsCache.conversionRate||0}%</div></div>
      <div class="stat-tile"><div class="label">เวลาคุยเฉลี่ย</div><div class="value num">${fmtDur(statsCache.avgDuration)}</div></div>
      <div class="stat-tile"><div class="label">โทรวันนี้</div><div class="value num">${statsCache.callsToday||0}</div></div>
      <div class="stat-tile"><div class="label">ส่ง SMS ถึงมือลูกค้า</div><div class="value num accent">${smsValue}</div><div style="font-size:11px; color:var(--text-3); margin-top:4px">${esc(smsSub)}</div></div>`
  }

  const barsEl = document.getElementById('outcomeBars')
  if (barsEl) {
    const entries = Object.entries(statsCache.outcomes || {}).sort((a,b)=>b[1]-a[1])
    barsEl.innerHTML = entries.length ? entries.map(([k,v]) => `
      <div class="bar-row">
        <div class="bar-label">${esc(outcomeLabel(k))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/(statsCache.total||1)*100)}%"></div></div>
        <div class="bar-value num">${v}</div>
      </div>`).join('') : '<div class="empty">ยังไม่มีข้อมูล</div>'
  }

  const chartWrap = document.getElementById('chartWrap')
  if (chartWrap && statsCache.dailyTrend) {
    chartWrap.innerHTML = buildComboChart(statsCache.dailyTrend.labels, statsCache.dailyTrend.calls, statsCache.dailyTrend.interested)
  }

  renderStatsStrip()
  renderTimePattern()

  setText('lastUpdated', new Intl.DateTimeFormat('th-TH', { timeZone:'Asia/Bangkok', hour:'2-digit', minute:'2-digit', second:'2-digit' }).format(new Date()))
}

function setTimePatternMode(mode){
  timePatternMode = mode
  document.querySelectorAll('#timePatternToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode))
  renderTimePattern()
}
function renderTimePattern(){
  const wrap = document.getElementById('timePatternWrap')
  if (!wrap || !statsCache) return
  if (timePatternMode === 'hour') {
    const byHour = statsCache.byHour || []
    if (!byHour.length) { wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return }
    const labels = byHour.map((_, i) => String(i).padStart(2, '0') + ':00')
    // ส่ง formatLabel เข้าไปตรงๆ เพราะ label เป็น "09:00" ไม่ใช่ "YYYY-MM-DD" แบบกราฟแนวโน้มรายวัน (ตัวช่วยเริ่มต้นของฟังก์ชันจะ slice ผิดรูปแบบ)
    wrap.innerHTML = buildComboChart(labels, byHour.map(h => h.calls), byHour.map(h => h.interested), l => esc(l))
    return
  }
  // รายวันในสัปดาห์ — เรียงแสดงเริ่มจันทร์ถึงอาทิตย์ตามความคุ้นเคย แม้ backend เก็บดัชนีตาม Date#getUTCDay (0=อาทิตย์)
  const dayNames = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์']
  const order = [1, 2, 3, 4, 5, 6, 0]
  const byDay = statsCache.byDayOfWeek || []
  if (!byDay.length) { wrap.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return }
  const maxCalls = Math.max(1, ...order.map(i => byDay[i]?.calls || 0))
  wrap.innerHTML = order.map(i => {
    const d = byDay[i] || { calls: 0, interested: 0 }
    const pct = Math.round((d.calls / maxCalls) * 100)
    const rate = d.calls ? Math.round((d.interested / d.calls) * 100) : 0
    return `
    <div class="bar-row">
      <div class="bar-label">${dayNames[i]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-value num" style="width:auto; white-space:nowrap">${d.calls} <span style="color:var(--text-3); font-weight:400">(${rate}% สนใจ)</span></div>
    </div>`
  }).join('')
}

// วันย้อนหลังหรือช่วงวันที่ — เทียบด้วย Bangkok today เดียวกับที่ initDashboardDateRange() ตั้งค่าเริ่มต้นไว้

// formatLabel ไม่ระบุ = ใช้ค่าเริ่มต้นเดิม (ตัด YYYY- ออกจาก label วันที่ YYYY-MM-DD) — กราฟแนวโน้มรายวันเดิมยังทำงานเหมือนเดิมทุกจุด
// ใส่ formatLabel เองได้เมื่อ label ไม่ใช่รูปแบบวันที่ (เช่น "09:00" ของกราฟรายชั่วโมง) กันไม่ให้ถูก slice(5) มั่วจนว่างเปล่า
function buildComboChart(labels, bars, line, formatLabel){
  const w = 640, h = 220, padL = 34, padR = 14, padT = 16, padB = 26
  const innerW = w - padL - padR, innerH = h - padT - padB
  const maxV = Math.max(1, ...bars) * 1.2
  const bw = innerW / Math.max(1, bars.length)
  const fmtDate = formatLabel || (l => esc((l||'').slice(5)))

  // เส้น grid 4 เส้น พร้อมตัวเลขกำกับแกน Y (ปัดเป็นเลขกลมๆ) — เดิมไม่มีเลย อ่านค่าไม่ได้เลยถ้าไม่กะจากความสูงเอาเอง
  const tickCount = 3
  const grid = Array.from({length: tickCount + 1}, (_, i) => {
    const y = padT + i * innerH / tickCount
    const val = Math.round(maxV * (tickCount - i) / tickCount)
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--glass-border)" stroke-width="1"/>
      <text x="${(padL-6).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--text-3)">${val}</text>`
  }).join('')

  const barsSvg = bars.map((v,i) => {
    const bh = (v/maxV) * innerH
    const x = padL + i*bw + bw*0.22
    const y = padT + innerH - bh
    const bwRect = bw*0.56
    const isLast = i === bars.length - 1
    // label ค่าตรงปลายแท่งเฉพาะแท่งล่าสุด (label ทุกแท่งจะรกเกินไป) ที่เหลือดูจากแกน Y หรือ hover เอา
    const valueLabel = isLast && v > 0
      ? `<text x="${(x+bwRect/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--text-2)">${v}</text>`
      : ''
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwRect.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="var(--accent)" opacity="0.4"><title>${fmtDate(labels[i])}: โทร ${v} สาย</title></rect>${valueLabel}`
  }).join('')
  const pts = line.map((v,i) => {
    const x = padL + i*bw + bw/2
    const y = padT + innerH - (v/maxV)*innerH
    return [x,y]
  })
  const linePath = pts.length ? pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') : ''
  const areaPath = pts.length ? linePath + ` L ${pts[pts.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L ${pts[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z` : ''
  const dotEvery = Math.max(1, Math.ceil(pts.length / 14))
  const dots = pts.map((p,i) => {
    if (!(i % dotEvery === 0 || i === pts.length-1)) return ''
    const isLast = i === pts.length-1
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isLast?5.5:3}" fill="${isLast?'var(--accent)':'var(--glass-bg-strong)'}" stroke="var(--accent)" stroke-width="2"><title>${fmtDate(labels[i])}: สนใจ ${line[i]} สาย</title></circle>`
  }).join('')
  // label ค่าล่าสุดของเส้น "สนใจ" ไว้ข้างจุดสุดท้าย (endpoint label ตาม spec)
  const lastLineLabel = pts.length
    ? `<text x="${(pts[pts.length-1][0]+8).toFixed(1)}" y="${(pts[pts.length-1][1]+4).toFixed(1)}" font-size="11" font-weight="700" text-anchor="start" fill="var(--accent)">${line[line.length-1]}</text>`
    : ''
  const labelEvery = Math.max(1, Math.ceil(labels.length / 8))
  const labelsSvg = labels.map((l,i) => i % labelEvery === 0 ? `<text x="${(padL+i*bw+bw/2).toFixed(1)}" y="${h-6}" font-size="10.5" text-anchor="middle" fill="var(--text-3)">${fmtDate(l)}</text>` : '').join('')
  return `
    <div class="row" style="gap:16px; margin-bottom:10px; font-size:11.5px; color:var(--text-2)">
      <span class="row" style="gap:5px"><span style="width:10px; height:10px; border-radius:3px; background:var(--accent); opacity:0.4; display:inline-block"></span>โทรทั้งหมด</span>
      <span class="row" style="gap:5px"><span style="width:12px; height:2px; background:var(--accent); display:inline-block"></span>สนใจ</span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${barsSvg}
    <path d="${areaPath}" fill="url(#chartGrad)"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${lastLineLabel}${labelsSvg}
  </svg>`
}

let blocklistCache = new Set()
async function loadContacts(){
  // เบอร์ contacts ต้องโหลดให้ได้ ไม่งั้นทั้งหน้าใช้ไม่ได้ — blocklist แค่ badge เสริม ถ้าโหลดไม่ได้ให้หน้าใช้งานต่อได้ปกติ (แค่ไม่โชว์ badge บล็อก)
  const [contactsResult, blocklistResult] = await Promise.allSettled([
    apiFetch('/api/contacts'),
    apiFetch('/api/blocklist'),
  ])
  if (contactsResult.status === 'rejected') { toast('โหลดรายชื่อเบอร์ไม่สำเร็จ', 'danger'); return }
  contactsCache = await contactsResult.value.json()
  try {
    if (blocklistResult.status !== 'fulfilled') throw new Error('blocklist fetch rejected')
    blocklistCache = new Set((await blocklistResult.value.json()).map(b => b.phone))
  } catch (e) {
    blocklistCache = new Set()
  }
  selectedContacts.clear()
  updateContactsBulkBar()
  filterContacts('')
}
// เบอร์ที่ลบแล้ว (soft delete) ไม่โชว์ในรายการอีกต่อไป — เดิมยังโผล่อยู่ในตารางเหมือนเบอร์ปกติทำให้ดูเหมือนปุ่มลบไม่ทำงาน

          toast(`เลิกทำแล้ว — ปลดบล็อก ${phones.length} เบอร์`)
          loadContacts()
        }
      })

function bulkDeleteContacts(){
  const phones = [...selectedContacts]
  openConfirm({
    title: `ลบ ${phones.length} เบอร์ที่เลือก?`,
    message: 'เบอร์ทั้งหมดที่เลือกจะถูกทำเครื่องหมายว่าลบแล้ว',
    confirmLabel: 'ลบทั้งหมด',
    onConfirm: async () => {
      // Design Freeze "Contacts Bulk Soft-Delete + Row-Safe Undo" (2026-09-02) — 1 request แทน N สาย
      // DELETE เดิม (Promise.all ที่ยิงทีละเบอร์ ไม่เช็ค res.ok เลย) ต้องเช็คผลจริงก่อนประกาศสำเร็จ/เคลียร์
      // selection — ถ้า request พังทั้งก้อน (เช่น Sheets API ล่ม) ต้องไม่บอกผู้ใช้ว่าลบแล้วทั้งที่ยังไม่ได้ลบ
      let res, data
      try {
        res = await apiFetch('/api/contacts/bulk-delete', { method: 'POST', body: { phones } })
        data = await res.json()
      } catch (err) {
        toast('ลบเบอร์ไม่สำเร็จ: ' + err.message, 'danger')
        return
      }
      if (!res.ok) {
        toast(data?.error || 'ลบเบอร์ไม่สำเร็จ', 'danger')
        return // selection ยังอยู่ครบ — ให้ผู้ใช้ retry ได้
      }

      selectedContacts.clear()
      loadContacts()

      // รายงานตามตัวเลขจริงที่ server คืนมา — ไม่ใช่ประกาศว่า phones.length สำเร็จเสมอเหมือนเดิม
      const parts = [`ลบสำเร็จ ${data.deletedPhones}/${data.requestedPhones} เบอร์`]
      if (data.deletedRows > data.deletedPhones) parts.push(`(${data.deletedRows} รายการ — มีเบอร์ซ้ำ campaign)`)
      if (data.notFoundPhones?.length) parts.push(`ไม่พบ ${data.notFoundPhones.length} เบอร์`)
      const undoEntries = data.undo || []

      toast(parts.join(' '), 'danger', undoEntries.length ? {
        label: 'เลิกทำ',
        onClick: async () => {
          const undoRes = await apiFetch('/api/contacts/bulk-restore', { method: 'POST', body: { undo: undoEntries } })
          const undoData = await undoRes.json()
          if (!undoRes.ok) { toast(undoData?.error || 'เลิกทำไม่สำเร็จ', 'danger'); return }
          const msg = undoData.conflicts?.length
            ? `เลิกทำแล้ว ${undoData.restoredRows} รายการ (ติด conflict ${undoData.conflicts.length} รายการ — ถูกแก้ไปแล้วระหว่างนี้)`
            : `เลิกทำแล้ว — คืนค่า ${undoData.restoredRows} รายการ`
          toast(msg)
          loadContacts()
        }
      } : undefined)
    }
  })
}
let contactsSortState = { key: null, dir: 1 }
function sortContacts(key){
  if (contactsSortState.key === key) contactsSortState.dir *= -1
  else { contactsSortState.key = key; contactsSortState.dir = 1 }
  // เรียงใหม่โดยคงคำค้นหาที่พิมพ์ค้างอยู่ไว้ (ไม่รีเซ็ตช่องค้นหาทิ้ง)
  filterContacts(document.getElementById('contactsSearchInput')?.value || '')
}
function filterContacts(q){
  q = q.trim().toLowerCase()
  updateSortIndicators('contactsThead', contactsSortState)
  const filtered = visibleContacts().filter(c => !q || c.phone.includes(q) || (c.name||'').toLowerCase().includes(q))
  // คอลัมน์ Campaign เรียงตามชื่อที่โชว์จริง (campaignName) ไม่ใช่ id ดิบ — ผู้ใช้เห็นชื่อ ไม่เห็น id
  const rows = sortRows(filtered, contactsSortState, (c, key) => key === 'campaign' ? campaignName(c.campaign) : c[key])
  const body = document.getElementById('contactsTable')
  if (!body) return
  if (!rows.length) { body.innerHTML = '<tr><td colspan="6" class="empty">ไม่พบข้อมูล</td></tr>'; return }
  body.innerHTML = rows.map(c => {
    const blocked = blocklistCache.has(c.phone)
    const statusCell = blocked
      ? `<span class="pill blocked">บล็อก</span>`
      : (c.status === 'retry_pending'
          ? `<span class="pill retry_pending">รอโทรซ้ำ (${esc(c.retry_count||0)}/3)</span>`
          : `<span class="pill ${esc(c.status)}">${esc(c.status)}</span>`)
    const blockBtn = blocked
      ? `<button class="btn btn-icon btn-ghost" title="ยกเลิกบล็อก" onclick="confirmUnblockContact('${escJsAttr(c.phone)}')">${icon('check')}</button>`
      : `<button class="btn btn-icon btn-ghost" title="ห้ามโทรอีก" onclick="confirmBlockContact('${escJsAttr(c.phone)}')">${icon('block')}</button>`
    return `
    <tr>
      <td><input type="checkbox" ${selectedContacts.has(c.phone)?'checked':''} onchange="toggleContactSelect('${escJsAttr(c.phone)}', this.checked)"></td>
      <td class="num">${esc(c.phone)}</td>
      <td>${esc(c.name)}</td>
      <td style="color:var(--text-2)">${esc((campaignsCache.find(x=>x.id===c.campaign)||{}).name || c.campaign)}</td>
      <td>${statusCell}</td>
      <td>
        <button class="btn btn-icon btn-ghost" title="แก้ไข" onclick="openContactEdit('${escJsAttr(c.phone)}')">${icon('edit')}</button>
        ${blockBtn}
        <button class="btn btn-icon btn-ghost danger" title="ลบ" onclick="confirmDeleteContact('${escJsAttr(c.phone)}')">${icon('trash')}</button>
      </td>
    </tr>`
  }).join('')
}
