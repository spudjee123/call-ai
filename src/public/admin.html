<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call AI — Control Center</title>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --warning: #d97706;
    --warning-bg: #fef3c7;
    --muted-bg: #eef0f4;
    --sidebar-bg: #14162b;
    --sidebar-text: #a9acc9;
    --sidebar-active: #262a52;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: inherit; }

  input[type=text], input[type=password], input[type=tel], select, textarea {
    padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  textarea { width: 100%; min-height: 160px; resize: vertical; line-height: 1.5; }

  button, .btn { padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    font-size: 14px; cursor: pointer; background: #fff; color: var(--text); transition: opacity .15s; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: white; border: none; }
  .btn-success { background: var(--success); color: white; border: none; }
  .btn-danger { background: var(--danger); color: white; border: none; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { background: transparent; border: none; color: var(--primary); padding: 0; margin-right: 12px; font-size: 13px; }
  .btn-ghost.danger { color: var(--danger); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border); }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .card-header h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-body { padding: 20px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: var(--muted-bg); font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.clickable { cursor: pointer; }

  .pill { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-block; }
  .interested { background: var(--success-bg); color: #166534; }
  .not_interested, .angry, .failed { background: var(--danger-bg); color: #991b1b; }
  .callback { background: var(--warning-bg); color: #92400e; }
  .no_answer, .busy, .canceled, .pending { background: var(--muted-bg); color: #4b5563; }
  .called, .active { background: var(--success-bg); color: #166534; }
  .deleted, .paused { background: var(--danger-bg); color: #991b1b; }

  .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .empty { text-align: center; color: #aaa; padding: 32px; font-size: 13px; }
  .msg { font-size: 13px; color: var(--text-muted); min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--success); }

  /* ---- layout shell ---- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--sidebar-bg); color: var(--sidebar-text); flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
  .sidebar-header { padding: 20px; font-weight: 700; color: #fff; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-header .sub { font-weight: 400; font-size: 11px; color: var(--sidebar-text); margin-top: 2px; }
  .nav { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav a { text-decoration: none; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px;
    display: flex; align-items: center; gap: 10px; color: var(--sidebar-text); }
  .nav a:hover { background: rgba(255,255,255,.06); }
  .nav a.active { background: var(--sidebar-active); color: #fff; }
  .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .sidebar-footer button { width: 100%; background: rgba(255,255,255,.06); color: var(--sidebar-text); border: none; }

  .main { margin-left: 220px; flex: 1; min-width: 0; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  .topbar h1 { font-size: 17px; font-weight: 700; }
  .badge { background: #eef2ff; color: var(--primary-dark); padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .page { padding: 24px 28px; max-width: 1200px; }

  @media (max-width: 760px) {
    .sidebar { width: 64px; }
    .sidebar .label, .sidebar-header .sub, .sidebar-header .full { display: none; }
    .main { margin-left: 64px; }
  }

  /* ---- dashboard stats ---- */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); padding: 18px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .bar-label { width: 110px; color: var(--text-muted); flex-shrink: 0; }
  .bar-track { flex: 1; background: var(--muted-bg); border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--primary); }
  .bar-value { width: 46px; text-align: right; font-weight: 600; flex-shrink: 0; }

  /* ---- login ---- */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--sidebar-bg); }
  .login-box { background: var(--surface); padding: 36px 32px; border-radius: var(--radius); box-shadow: 0 20px 50px rgba(0,0,0,.35); width: 320px; text-align: center; }
  .login-box h1 { font-size: 17px; margin-bottom: 4px; }
  .login-box .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .login-box input { width: 100%; margin-bottom: 12px; }
  .login-box button { width: 100%; }

  #app { display: none; }

  /* ---- modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,17,30,.5); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 720px;
    max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 15px; }
  .modal-header .sub { font-size: 12px; color: var(--text-muted); }
  .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); padding: 0 4px; }
  .modal-meta { padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-muted);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; background: #fafbfc; }
  .modal-meta b { color: var(--text); display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }
  .modal-messages { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; background: #fbfbfc; }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
  .bubble.ai { align-self: flex-start; background: #eef2ff; color: #1e293b; border-bottom-left-radius: 4px; }
  .bubble.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .bubble-label { font-size: 10px; opacity: .65; margin-bottom: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
</style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <h1>Call AI — Control Center</h1>
      <div class="sub">กรอกรหัสผ่านเพื่อเข้าใช้งาน</div>
      <input type="password" id="loginPassword" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter') login()">
      <button class="btn-primary" onclick="login()">เข้าสู่ระบบ</button>
      <div class="msg error" id="loginError"></div>
    </div>
  </div>

  <div id="app">
    <div class="shell">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="full">Call AI</div>
          <div class="sub">Control Center</div>
        </div>
        <nav class="nav">
          <a href="#/dashboard" data-page="dashboard">📊 <span class="label">Dashboard</span></a>
          <a href="#/campaigns" data-page="campaigns">📢 <span class="label">Campaigns</span></a>
          <a href="#/contacts" data-page="contacts">👥 <span class="label">เบอร์ติดต่อ</span></a>
          <a href="#/test" data-page="test">📞 <span class="label">ทดสอบโทร</span></a>
          <a href="#/history" data-page="history">📋 <span class="label">ประวัติการโทร</span></a>
        </nav>
        <div class="sidebar-footer">
          <button onclick="logout()"><span class="label">ออกจากระบบ</span> ⏻</button>
        </div>
      </div>

      <div class="main">
        <div class="topbar">
          <h1 id="pageTitle">Dashboard</h1>
          <span class="badge" id="activeBadge">0 Active</span>
        </div>
        <div class="page" id="pageContent"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="transcriptModal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h3 id="modalTitle">บทสนทนา</h3>
          <div class="sub" id="modalSubtitle"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-messages" id="modalMessages"></div>
    </div>
  </div>

<script>
  let token = localStorage.getItem('callai_token') || null
  let campaignsCache = []
  let historyCache = []
  let liveModalCallSid = null
  let liveModalTimer = null

  function esc(str) {
    const d = document.createElement('div')
    d.textContent = str == null ? '' : String(str)
    return d.innerHTML
  }

  function formatDuration(sec) {
    sec = Number(sec) || 0
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60)
    return `${m}:${String(s).padStart(2, '0')}`
  }

  // แปลง ISO timestamp (UTC) เป็นเวลาไทย (Asia/Bangkok, UTC+7)
  function formatDateTH(iso) {
    if (!iso) return ''
    const d = new Date(iso)
    if (isNaN(d)) return iso
    return new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
    }).format(d)
  }

  async function apiFetch(url, options = {}) {
    options.headers = Object.assign({}, options.headers, { 'Authorization': 'Bearer ' + token })
    if (options.body && typeof options.body !== 'string') {
      options.headers['Content-Type'] = 'application/json'
      options.body = JSON.stringify(options.body)
    }
    const res = await fetch(url, options)
    if (res.status === 401) {
      token = null
      localStorage.removeItem('callai_token')
      showLogin()
      throw new Error('Unauthorized')
    }
    return res
  }

  function showLogin() {
    document.getElementById('loginScreen').style.display = 'flex'
    document.getElementById('app').style.display = 'none'
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none'
    document.getElementById('app').style.display = 'block'
    refreshActiveGlobal()
    renderPage()
  }

  async function login() {
    const password = document.getElementById('loginPassword').value
    const errEl = document.getElementById('loginError')
    errEl.textContent = ''
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      })
      const data = await res.json()
      if (!res.ok) { errEl.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ'; return }
      token = data.token
      localStorage.setItem('callai_token', token)
      showApp()
    } catch (e) {
      errEl.textContent = 'เชื่อมต่อไม่ได้'
    }
  }

  async function logout() {
    try { await apiFetch('/api/auth/logout', { method: 'POST' }) } catch (e) {}
    token = null
    localStorage.removeItem('callai_token')
    showLogin()
  }

  // ==================== ROUTER ====================
  const PAGES = ['dashboard', 'campaigns', 'contacts', 'test', 'history']
  const PAGE_TITLES = { dashboard: 'Dashboard', campaigns: 'จัดการ Campaign', contacts: 'เบอร์ติดต่อ', test: 'ทดสอบโทร', history: 'ประวัติการโทร' }

  function currentPage() {
    const hash = location.hash.replace(/^#\/?/, '') || 'dashboard'
    return PAGES.includes(hash) ? hash : 'dashboard'
  }

  function renderPage() {
    const page = currentPage()
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page))
    document.getElementById('pageTitle').textContent = PAGE_TITLES[page]
    document.getElementById('pageContent').innerHTML = TEMPLATES[page]()
    INIT[page]()
  }

  window.addEventListener('hashchange', renderPage)

  // ==================== TEMPLATES ====================
  const TEMPLATES = {
    dashboard: () => `
      <div class="stats-grid">
        <div class="stat-card"><div class="label">โทรทั้งหมด</div><div class="value" id="statTotal">-</div></div>
        <div class="stat-card"><div class="label">สนใจ</div><div class="value" style="color:var(--success)" id="statInterested">-</div></div>
        <div class="stat-card"><div class="label">นัด Callback</div><div class="value" style="color:var(--warning)" id="statCallback">-</div></div>
        <div class="stat-card"><div class="label">ไม่รับสาย</div><div class="value" style="color:var(--text-muted)" id="statNoAnswer">-</div></div>
        <div class="stat-card"><div class="label">Conversion Rate</div><div class="value" id="statConversion">-</div></div>
        <div class="stat-card"><div class="label">เวลาคุยเฉลี่ย</div><div class="value" id="statAvgDuration">-</div></div>
        <div class="stat-card"><div class="label">โทรวันนี้</div><div class="value" id="statToday">-</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h2>สัดส่วนผลการโทร</h2><button class="btn btn-sm" onclick="loadStats()">รีเฟรช</button></div>
          <div class="card-body" id="outcomeBars"><div class="empty">กำลังโหลด...</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h2><span class="live-dot"></span> Active Calls</h2><button class="btn btn-sm" onclick="refreshActiveGlobal()">รีเฟรช</button></div>
          <div class="card-body">
            <table>
              <thead><tr><th>เบอร์</th><th>ชื่อ</th><th>เวลา</th><th></th></tr></thead>
              <tbody id="activeTable"><tr><td colspan="4" class="empty">ไม่มีสายที่กำลังโทร</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>`,

    campaigns: () => `
      <div class="card">
        <div class="card-header"><h2>Campaigns</h2><button class="btn btn-sm" onclick="loadCampaigns()">รีเฟรช</button></div>
        <div class="card-body">
          <table>
            <thead><tr><th>ID</th><th>ชื่อ</th><th>สถานะ</th><th>ประเภท</th><th>Voice</th><th>Actions</th></tr></thead>
            <tbody id="campaignTable"><tr><td colspan="6" class="empty">กำลังโหลด...</td></tr></tbody>
          </table>
          <div id="campaignEditPanel" style="display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:18px;">
            <h3 style="font-size:14px; margin-bottom:12px;">แก้ไข Campaign: <span id="editCampaignId"></span></h3>
            <div class="row" style="margin-bottom:10px;">
              <input type="text" id="editName" placeholder="ชื่อ campaign" style="flex:1">
              <input type="text" id="editVoiceId" placeholder="Voice ID">
              <select id="editStatus"><option value="active">active</option><option value="paused">paused</option></select>
            </div>
            <label style="font-size:12px;color:var(--text-muted)">Prompt / Script</label>
            <textarea id="editScript" placeholder="System prompt ที่ AI ใช้พูดกับลูกค้า"></textarea>
            <label style="font-size:12px;color:var(--text-muted)">ส่ง SMS follow-up เมื่อผลเป็น:</label>
            <div class="row" style="margin:10px 0 16px; font-size:13px;">
              <label class="row" style="gap:4px"><input type="checkbox" id="smsInterested"> สนใจ</label>
              <label class="row" style="gap:4px"><input type="checkbox" id="smsNotInterested"> ไม่สนใจ</label>
              <label class="row" style="gap:4px"><input type="checkbox" id="smsCallback"> Callback</label>
              <label class="row" style="gap:4px"><input type="checkbox" id="smsNoAnswer"> ไม่รับสาย</label>
              <label class="row" style="gap:4px"><input type="checkbox" id="smsAngry"> โกรธ</label>
            </div>
            <div class="row">
              <button class="btn-primary" onclick="saveCampaign()">บันทึก</button>
              <button onclick="closeCampaignEdit()">ยกเลิก</button>
              <span class="msg" id="campaignEditMsg"></span>
            </div>
          </div>
        </div>
      </div>`,

    contacts: () => `
      <div class="card">
        <div class="card-header"><h2>ลงชื่อเบอร์ใหม่</h2></div>
        <div class="card-body">
          <div class="row">
            <input type="tel" id="contactPhone" placeholder="เบอร์โทร">
            <input type="text" id="contactName" placeholder="ชื่อ">
            <select id="contactCampaign" class="campaign-select"><option value="">-- เลือก Campaign --</option></select>
            <button class="btn-primary" onclick="addContact()">+ เพิ่มเบอร์</button>
          </div>
          <div class="msg" id="addContactMsg"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h2>รายชื่อเบอร์</h2>
          <div class="row">
            <select id="contactsFilterCampaign" class="campaign-select" onchange="loadContacts()"><option value="">ทุก Campaign</option></select>
            <select id="contactsFilterStatus" onchange="loadContacts()">
              <option value="">ทุกสถานะ</option><option value="pending">pending</option><option value="called">called</option><option value="deleted">deleted</option>
            </select>
            <button class="btn btn-sm" onclick="loadContacts()">รีเฟรช</button>
          </div>
        </div>
        <div class="card-body">
          <table>
            <thead><tr><th>เบอร์</th><th>ชื่อ</th><th>Campaign</th><th>สถานะ</th><th>Actions</th></tr></thead>
            <tbody id="contactsTable"><tr><td colspan="5" class="empty">ยังไม่มีข้อมูล</td></tr></tbody>
          </table>
        </div>
      </div>`,

    test: () => `
      <div class="card">
        <div class="card-header"><h2>📞 ยิงโทรทดสอบ</h2></div>
        <div class="card-body">
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">ใช้ pipeline เดียวกับแคมเปญจริง — เสียค่าโทร/AI จริง ไม่บันทึกลง Contacts sheet</p>
          <div class="row">
            <input type="tel" id="testPhone" placeholder="เบอร์โทร เช่น +66812345678">
            <input type="text" id="testName" placeholder="ชื่อ (ไม่บังคับ)">
            <select id="testCampaign" class="campaign-select"><option value="">-- เลือก Campaign --</option></select>
            <button class="btn-primary" onclick="testCall()">📞 โทรทดสอบ</button>
          </div>
          <div class="msg" id="testCallMsg"></div>
        </div>
      </div>`,

    history: () => `
      <div class="card">
        <div class="card-header">
          <h2>ประวัติการโทร</h2>
          <div class="row">
            <select id="logCampaignFilter" class="campaign-select" onchange="loadLogs()"><option value="">ทุก Campaign</option></select>
            <button class="btn btn-sm" onclick="loadLogs()">รีเฟรช</button>
          </div>
        </div>
        <div class="card-body">
          <table>
            <thead><tr><th>เบอร์</th><th>ชื่อ</th><th>ผล</th><th>สรุป</th><th>เวลาคุย</th><th>วันที่</th></tr></thead>
            <tbody id="logTable"><tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr></tbody>
          </table>
        </div>
      </div>`,
  }

  const INIT = {
    dashboard: () => { loadStats(); refreshActiveGlobal() },
    campaigns: () => loadCampaigns(),
    contacts: () => { loadCampaigns(); loadContacts() },
    test: () => loadCampaigns(),
    history: () => { loadCampaigns(); loadLogs() },
  }

  // ==================== CAMPAIGNS (shared dropdown data) ====================
  function populateCampaignSelects() {
    document.querySelectorAll('.campaign-select').forEach(sel => {
      const current = sel.value
      const keepFirst = sel.options[0]
      sel.innerHTML = ''
      sel.appendChild(keepFirst)
      campaignsCache.forEach(c => {
        const opt = document.createElement('option')
        opt.value = c.id
        opt.text = c.name || c.id
        sel.appendChild(opt)
      })
      sel.value = current
    })
  }

  async function loadCampaigns() {
    const res = await apiFetch('/api/campaigns')
    campaignsCache = await res.json()
    populateCampaignSelects()
    const tbody = document.getElementById('campaignTable')
    if (!tbody) return
    if (!campaignsCache.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">ยังไม่มี campaign</td></tr>'; return }
    tbody.innerHTML = campaignsCache.map(c => `
      <tr>
        <td>${esc(c.id)}</td>
        <td>${esc(c.name)}</td>
        <td><span class="pill ${esc(c.status)}">${esc(c.status)}</span></td>
        <td>${esc(c.type)}</td>
        <td>${esc(c.voice_id)}</td>
        <td>
          <button class="btn-ghost" onclick="openCampaignEdit('${esc(c.id)}')">แก้ไข</button>
          <button class="btn-ghost" onclick="startCampaign('${esc(c.id)}')">▶ เริ่ม</button>
          <button class="btn-ghost danger" onclick="stopCampaign('${esc(c.id)}')">■ หยุด</button>
        </td>
      </tr>`).join('')
  }

  function openCampaignEdit(id) {
    const c = campaignsCache.find(x => x.id === id)
    if (!c) return
    document.getElementById('editCampaignId').textContent = id
    document.getElementById('editName').value = c.name || ''
    document.getElementById('editVoiceId').value = c.voice_id || ''
    document.getElementById('editStatus').value = c.status === 'paused' ? 'paused' : 'active'
    document.getElementById('editScript').value = c.script || c.system_prompt || ''
    document.getElementById('smsInterested').checked = c.sms_interested === 'TRUE' || c.sms_interested === true
    document.getElementById('smsNotInterested').checked = c.sms_not_interested === 'TRUE' || c.sms_not_interested === true
    document.getElementById('smsCallback').checked = c.sms_callback === 'TRUE' || c.sms_callback === true
    document.getElementById('smsNoAnswer').checked = c.sms_no_answer === 'TRUE' || c.sms_no_answer === true
    document.getElementById('smsAngry').checked = c.sms_angry === 'TRUE' || c.sms_angry === true
    document.getElementById('campaignEditMsg').textContent = ''
    document.getElementById('campaignEditPanel').style.display = 'block'
  }

  function closeCampaignEdit() {
    document.getElementById('campaignEditPanel').style.display = 'none'
  }

  async function saveCampaign() {
    const id = document.getElementById('editCampaignId').textContent
    const msgEl = document.getElementById('campaignEditMsg')
    const existing = campaignsCache.find(c => c.id === id)
    const scriptKey = (existing?.system_prompt !== undefined && existing?.script === undefined) ? 'system_prompt' : 'script'
    const updates = {
      name: document.getElementById('editName').value,
      voice_id: document.getElementById('editVoiceId').value,
      status: document.getElementById('editStatus').value,
      [scriptKey]: document.getElementById('editScript').value,
      sms_interested: document.getElementById('smsInterested').checked ? 'TRUE' : 'FALSE',
      sms_not_interested: document.getElementById('smsNotInterested').checked ? 'TRUE' : 'FALSE',
      sms_callback: document.getElementById('smsCallback').checked ? 'TRUE' : 'FALSE',
      sms_no_answer: document.getElementById('smsNoAnswer').checked ? 'TRUE' : 'FALSE',
      sms_angry: document.getElementById('smsAngry').checked ? 'TRUE' : 'FALSE',
    }
    try {
      const res = await apiFetch(`/api/campaigns/${encodeURIComponent(id)}`, { method: 'PATCH', body: updates })
      const data = await res.json()
      if (!res.ok) { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'บันทึกไม่สำเร็จ'; return }
      msgEl.className = 'msg ok'; msgEl.textContent = '✓ บันทึกแล้ว'
      loadCampaigns()
    } catch (e) {}
  }

  async function startCampaign(id) {
    await apiFetch('/api/campaign/start', { method: 'POST', body: { campaignId: id } })
    setTimeout(() => { if (currentPage() === 'dashboard') loadStats() }, 2000)
  }

  async function stopCampaign(id) {
    await apiFetch('/api/campaign/stop', { method: 'POST', body: { campaignId: id } })
  }

  // ==================== DASHBOARD ====================
  async function loadStats() {
    const res = await apiFetch('/api/stats')
    const stats = await res.json()
    const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }
    setText('statTotal', stats.total || 0)
    setText('statInterested', (stats.outcomes && stats.outcomes.interested) || 0)
    setText('statCallback', (stats.outcomes && stats.outcomes.callback) || 0)
    setText('statNoAnswer', (stats.outcomes && stats.outcomes.no_answer) || 0)
    setText('statConversion', (stats.conversionRate || 0) + '%')
    setText('statAvgDuration', formatDuration(stats.avgDuration))
    setText('statToday', stats.callsToday || 0)

    const barsEl = document.getElementById('outcomeBars')
    if (barsEl) {
      const entries = Object.entries(stats.outcomes || {}).sort((a, b) => b[1] - a[1])
      if (!entries.length) {
        barsEl.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'
      } else {
        const total = stats.total || 1
        barsEl.innerHTML = entries.map(([outcome, count]) => `
          <div class="bar-row">
            <div class="bar-label">${esc(outcome)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / total * 100)}%"></div></div>
            <div class="bar-value">${count}</div>
          </div>`).join('')
      }
    }
  }

  async function refreshActiveGlobal() {
    const res = await apiFetch('/api/calls/active')
    const calls = await res.json()
    document.getElementById('activeBadge').textContent = `${calls.length} Active`
    const tbody = document.getElementById('activeTable')
    if (!tbody) return
    if (!calls.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">ไม่มีสายที่กำลังโทร</td></tr>'; return }
    tbody.innerHTML = calls.map(c => `
      <tr>
        <td>${esc(c.phone)}</td>
        <td>${esc(c.name)}</td>
        <td>${formatDuration(c.duration)}</td>
        <td><button class="btn-ghost" onclick="openLiveModal('${esc(c.callSid)}','${esc(c.phone)}','${esc(c.name)}')">ดูบทสนทนา</button></td>
      </tr>`).join('')
  }

  setInterval(() => { if (token) refreshActiveGlobal() }, 10000)

  // ==================== CONTACTS ====================
  async function loadContacts() {
    const campaignId = document.getElementById('contactsFilterCampaign').value
    const status = document.getElementById('contactsFilterStatus').value
    const params = new URLSearchParams()
    if (campaignId) params.set('campaignId', campaignId)
    if (status) params.set('status', status)
    const res = await apiFetch('/api/contacts?' + params.toString())
    const contacts = await res.json()
    const tbody = document.getElementById('contactsTable')
    if (!contacts.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">ยังไม่มีข้อมูล</td></tr>'; return }
    tbody.innerHTML = contacts.map(c => `
      <tr>
        <td>${esc(c.phone)}</td>
        <td>${esc(c.name)}</td>
        <td>${esc(c.campaign)}</td>
        <td><span class="pill ${esc(c.status)}">${esc(c.status)}</span></td>
        <td><button class="btn-ghost danger" onclick="deleteContact('${esc(c.phone)}')">ลบ</button></td>
      </tr>`).join('')
  }

  async function addContact() {
    const phone = document.getElementById('contactPhone').value.trim()
    const name = document.getElementById('contactName').value.trim()
    const campaign = document.getElementById('contactCampaign').value
    const msgEl = document.getElementById('addContactMsg')
    if (!phone || !campaign) { msgEl.className = 'msg error'; msgEl.textContent = 'กรอกเบอร์และเลือก campaign ก่อน'; return }
    try {
      const res = await apiFetch('/api/contacts', { method: 'POST', body: { phone, name, campaign } })
      const data = await res.json()
      if (!res.ok) { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'เพิ่มไม่สำเร็จ'; return }
      msgEl.className = 'msg ok'; msgEl.textContent = '✓ เพิ่มแล้ว'
      document.getElementById('contactPhone').value = ''
      document.getElementById('contactName').value = ''
      loadContacts()
    } catch (e) {}
  }

  async function deleteContact(phone) {
    await apiFetch(`/api/contacts/${encodeURIComponent(phone)}`, { method: 'DELETE' })
    loadContacts()
  }

  // ==================== TEST CALL ====================
  async function testCall() {
    const phone = document.getElementById('testPhone').value.trim()
    const name = document.getElementById('testName').value.trim()
    const campaignId = document.getElementById('testCampaign').value
    const msgEl = document.getElementById('testCallMsg')
    if (!phone || !campaignId) { msgEl.className = 'msg error'; msgEl.textContent = 'กรอกเบอร์และเลือก campaign ก่อน'; return }
    msgEl.className = 'msg'; msgEl.textContent = 'กำลังยิงโทร...'
    try {
      const res = await apiFetch('/api/calls/test', { method: 'POST', body: { phone, name, campaignId } })
      const data = await res.json()
      if (!res.ok) { msgEl.className = 'msg error'; msgEl.textContent = data.error || 'ล้มเหลว'; return }
      msgEl.className = 'msg ok'; msgEl.textContent = `✓ กำลังโทรไป ${phone}`
      setTimeout(refreshActiveGlobal, 3000)
    } catch (e) {}
  }

  // ==================== HISTORY ====================
  async function loadLogs() {
    const campaignId = document.getElementById('logCampaignFilter').value
    const url = campaignId ? `/api/calls?campaignId=${encodeURIComponent(campaignId)}&limit=100` : '/api/calls?limit=100'
    const res = await apiFetch(url)
    historyCache = await res.json()
    const tbody = document.getElementById('logTable')
    if (!historyCache.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr>'; return }
    tbody.innerHTML = historyCache.map((l, i) => `
      <tr class="clickable" onclick="openHistoryModal(${i})">
        <td>${esc(l.phone)}</td>
        <td>${esc(l.name)}</td>
        <td><span class="pill ${esc(l.outcome)}">${esc(l.outcome)}</span></td>
        <td>${esc((l.summary || '').substring(0, 60))}</td>
        <td>${formatDuration(l.duration)}</td>
        <td>${esc(formatDateTH(l.timestamp))}</td>
      </tr>`).join('')
  }

  // ==================== TRANSCRIPT MODAL ====================
  function parseTranscript(str) {
    if (!str) return []
    return str.split(' | ').map(turn => {
      const idx = turn.indexOf(': ')
      if (idx === -1) return { role: 'ai', text: turn }
      const label = turn.slice(0, idx)
      return { role: label === 'ลูกค้า' ? 'user' : 'ai', text: turn.slice(idx + 2) }
    })
  }

  function renderBubbles(turns) {
    if (!turns.length) return '<div class="empty">ยังไม่มีบทสนทนา</div>'
    return turns.map(t => `
      <div class="bubble ${t.role}">
        <div class="bubble-label">${t.role === 'user' ? 'ลูกค้า' : 'AI'}</div>
        <div>${esc(t.text)}</div>
      </div>`).join('')
  }

  function stopLivePolling() {
    if (liveModalTimer) { clearInterval(liveModalTimer); liveModalTimer = null }
    liveModalCallSid = null
  }

  function openHistoryModal(index) {
    stopLivePolling()
    const c = historyCache[index]
    if (!c) return
    document.getElementById('modalTitle').textContent = `${c.name || ''} — ${c.phone || ''}`
    document.getElementById('modalSubtitle').textContent = formatDateTH(c.timestamp)
    document.getElementById('modalMeta').innerHTML = `
      <div>ผล<b>${esc(c.outcome)}</b></div>
      <div>เวลาคุย<b>${formatDuration(c.duration)}</b></div>
      <div>สรุป<b>${esc(c.summary) || '-'}</b></div>
      <div>ประเด็นสำคัญ<b>${esc(c.key_points) || '-'}</b></div>
      <div>สิ่งที่ควรทำต่อ<b>${esc(c.next_action) || '-'}</b></div>`
    document.getElementById('modalMessages').innerHTML = renderBubbles(parseTranscript(c.transcript))
    document.getElementById('transcriptModal').classList.add('open')
  }

  async function loadLiveMessages(callSid) {
    try {
      const res = await apiFetch(`/api/calls/active/${encodeURIComponent(callSid)}`)
      if (!res.ok) { stopLivePolling(); return }
      const data = await res.json()
      document.getElementById('modalSubtitle').textContent = 'กำลังคุยอยู่ · ' + formatDuration(data.duration)
      const turns = (data.messages || []).map(m => ({ role: m.role === 'user' ? 'user' : 'ai', text: m.content }))
      document.getElementById('modalMessages').innerHTML = renderBubbles(turns)
    } catch (e) {}
  }

  function openLiveModal(callSid, phone, name) {
    stopLivePolling()
    liveModalCallSid = callSid
    document.getElementById('modalTitle').textContent = `${name || ''} — ${phone || ''}`
    document.getElementById('modalMeta').innerHTML = `<div>สถานะ<b><span class="live-dot"></span> กำลังคุยอยู่</b></div>`
    document.getElementById('modalMessages').innerHTML = '<div class="empty">กำลังโหลด...</div>'
    document.getElementById('transcriptModal').classList.add('open')
    loadLiveMessages(callSid)
    liveModalTimer = setInterval(() => loadLiveMessages(callSid), 3000)
  }

  function closeModal() {
    stopLivePolling()
    document.getElementById('transcriptModal').classList.remove('open')
  }

  // ==================== BOOT ====================
  window.onload = async () => {
    if (!token) { showLogin(); return }
    try {
      await apiFetch('/api/stats')
      showApp()
    } catch (e) {
      showLogin()
    }
  }
</script>
</body>
</html>
